[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbiliclaw"
version = "0.3.152"
description = "Your local-first, cross-platform AI discovery friend for Bilibili, Zhihu, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "OpenBiliClaw Contributors" },
]
keywords = ["bilibili", "zhihu", "ai", "agent", "recommendation", "content-discovery", "cross-platform", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "obc-llm>=0.1.0",
    "obc-discovery>=0.1.0",
    "obc-soul>=0.1.0",
    "httpx>=0.27",
    "scrapetube>=2.1",
    "yt-dlp>=2024.1.0",
    "bilibili-api-python>=16",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.66",
    # X (Twitter) discovery uses the import package ``twitter_cli``. Keep it in
    # the default install so enabling [sources.twitter] never fails at runtime.
    "twitter-cli>=0.8.5",
    "fastapi>=0.115",
    "rich>=13",
    "typer>=0.12",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "uvicorn>=0.32",
    # numpy accelerates the article-RAG cosine scan (~32M float ops → one
    # vectorised matmul) and the cold index load; the retriever degrades to a
    # pure-Python loop if numpy is unavailable.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "websockets>=13",
]
local-llm = [
    "ollama>=0.4",
]
x = [
    # Backwards-compatible alias for users/scripts that already install
    # ``openbiliclaw[x]``. The dependency is also part of the default runtime set.
    "twitter-cli>=0.8.5",
]
eval = [
    "claude-agent-sdk>=0.1",
]
browser = [
    "playwright>=1.40",
]
packaging = [
    # Desktop installer builds (packaging/build.py). Bundles the backend into a
    # macOS .app/.dmg or Windows onedir for the Inno Setup installer.
    "pyinstaller>=6.11",
    # System-tray desktop mode (packaging/entry.py): tray icon + menu so the app
    # runs without a console window — Windows system tray and macOS menu bar.
    "pystray>=0.19",
    "Pillow>=10.0",
    # pystray's macOS backend needs pyobjc (Foundation / AppKit / Quartz).
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
openbiliclaw = "openbiliclaw.cli:app"

[project.urls]
Homepage = "https://github.com/whiteguo233/OpenBiliClaw"
Repository = "https://github.com/whiteguo233/OpenBiliClaw"
Issues = "https://github.com/whiteguo233/OpenBiliClaw/issues"

[tool.uv.sources]
obc-llm = { path = "packages/obc_llm", editable = true }
obc-discovery = { path = "packages/obc-discovery", editable = true }
obc-soul = { path = "packages/obc-soul", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openbiliclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]  # Scripts contain long prompt strings
# Large files pending refactor/split — E501 will be addressed during restructuring
"src/openbiliclaw/api/app.py" = ["E501"]
"src/openbiliclaw/api/recommendation_routes.py" = ["E501"]  # M1 extraction from app.py; formatting deferred
"src/openbiliclaw/storage/database.py" = ["E501"]
"src/openbiliclaw/runtime/refresh.py" = ["E501"]
"src/openbiliclaw/cli/__init__.py" = ["E501"]  # 阶段2 cli/ 包化，E501 随分模块拆分逐步清零
"src/openbiliclaw/diary/advanced_memory.py" = ["E501"]
"src/openbiliclaw/diary/emotion.py" = ["E501"]
"src/openbiliclaw/diary/timeline.py" = ["E501"]
# 笔记模块：prompt 模板包含大段中文文本
"src/openbiliclaw/notes/synthesis/prompts.py" = ["E501"]
# Knowledge Forge：prompt 模板包含大段中文文本
"src/openbiliclaw/knowledge_forge/prompts.py" = ["E501"]
# SQL 语句、URL、长字符串导致的行长
"src/openbiliclaw/api/chat_recommend_routes.py" = ["E501"]
"src/openbiliclaw/api/source_routes.py" = ["E501"]
"src/openbiliclaw/chat_analysis/service.py" = ["E501"]
"src/openbiliclaw/diary/insights.py" = ["E501"]
"src/openbiliclaw/diary/service.py" = ["E501"]
"src/openbiliclaw/diary/store.py" = ["E501"]
"src/openbiliclaw/health/store.py" = ["E501"]
"src/openbiliclaw/notes/store.py" = ["E501"]
"src/openbiliclaw/self_evolution/content_filler.py" = ["E501"]
"src/openbiliclaw/self_evolution/insight_report.py" = ["E501"]
"src/openbiliclaw/self_evolution/interest_drift.py" = ["E501"]
"src/openbiliclaw/self_evolution/knowledge_graph.py" = ["E501"]
"src/openbiliclaw/self_evolution/learning_path.py" = ["E501"]
"src/openbiliclaw/storage/_recommendation_mixin.py" = ["E501"]
"src/openbiliclaw/storage/_saved_memberships_mixin.py" = ["E501"]
"src/openbiliclaw/storage/_schema_mixin.py" = ["E501"]
"src/openbiliclaw/storage/_user_feedback_mixin.py" = ["E501"]
"src/openbiliclaw/storage/_view_history_mixin.py" = ["E501"]
"src/openbiliclaw/synthesis/models.py" = ["E501"]
"src/openbiliclaw/chat_analysis/store.py" = ["E501"]
"src/openbiliclaw/storage/_article_mixin.py" = ["E501"]
"src/openbiliclaw/interview/review_store.py" = ["E501"]
"src/openbiliclaw/self_evolution/proactive_push.py" = ["E501"]
"src/openbiliclaw/self_evolution/auto_topic_generator.py" = ["E501"]
"src/openbiliclaw/api/_llm_routes.py" = ["E501"]
"src/openbiliclaw/self_evolution/insights.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["untyped-decorator", "type-arg", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "aiohttp",
    "aiohttp.*",
    "claude_agent_sdk",
    "diskcache",
    "feedparser",
    "google",
    "google.*",
    "playwright.*",
    "requests",
    "rich.*",
    "scrapetube",
    "typer",
    "twitter_cli.*",
    "yt_dlp",
]
ignore_missing_imports = true

# CLI 和 saved_sync 路由大量使用 typer/FastAPI 装饰器，这些第三方装饰器无类型存根
[[tool.mypy.overrides]]
module = [
    "openbiliclaw.cli",
    "openbiliclaw.api.saved_sync_routes",
]
disable_error_code = ["untyped-decorator", "type-arg", "no-any-return", "union-attr"]

# saved_sync 模块是 WIP 功能，调用了 Database/BilibiliAPIClient 中尚未实现的方法
# 暂时忽略 attr-defined 错误，待方法实现后移除
[[tool.mypy.overrides]]
module = [
    "openbiliclaw.saved_sync.*",
]
disable_error_code = ["attr-defined"]

# storage mixin 模式：mixin 类访问 Database 类提供的属性，mypy 无法识别
# 暂时忽略 attr-defined 错误，这些属性在运行时确实存在
[[tool.mypy.overrides]]
module = [
    "openbiliclaw.storage.*",
]
disable_error_code = ["attr-defined"]

# self_evolution 模块：大量函数缺少类型注解，待后续补充
[[tool.mypy.overrides]]
module = [
    "openbiliclaw.self_evolution.*",
]
disable_error_code = ["no-untyped-def"]

# health 模块：数据库查询返回 int | None，传递给期望 int 的函数
[[tool.mypy.overrides]]
module = [
    "openbiliclaw.health.*",
]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: real Bilibili API checks that require local credentials",
]
