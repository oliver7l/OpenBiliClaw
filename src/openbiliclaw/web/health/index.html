<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人健康档案 - OpenBiliClaw</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--border:#e2e5ea;--text:#1a1d23;--muted:#6b7280;
  --primary:#2563eb;--primary-light:#dbeafe;--danger:#dc2626;--success:#16a34a;
  --warning:#d97706;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .back{color:var(--muted);text-decoration:none;font-size:14px}
.header .back:hover{color:var(--primary)}
.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tab{padding:12px 18px;font-size:14px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.danger{color:var(--danger)}
.stat-card .value.warning{color:var(--warning)}
.stat-card .value.success{color:var(--success)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#1d4ed8;color:#fff}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2;border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f9fafb;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:hover{background:#f9fafb}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.badge-active{background:#dcfce7;color:#166534}
.badge-inactive{background:#f3f4f6;color:#6b7280}
.badge-resolved{background:#dbeafe;color:#1e40af}
.badge-chronic{background:#fef3c7;color:#92400e}
.badge-high{background:#fee2e2;color:#991b1b}
.badge-low{background:#fef3c7;color:#92400e}
.badge-normal{background:#dcfce7;color:#166534}
.badge-outpatient{background:#dbeafe;color:#1e40af}
.badge-emergency{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;font-size:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.detail-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.detail-row .key{color:var(--muted);min-width:100px;flex-shrink:0}
.detail-row .val{flex:1}
.lab-table td.abnormal{color:var(--danger);font-weight:600}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.timeline{position:relative;padding-left:8px}
.timeline-date{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;padding-left:32px}
.timeline-item{position:relative;padding:10px 0 10px 40px;border-left:3px solid #e5e7eb;margin-left:14px}
.timeline-icon{position:absolute;left:-15px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.timeline-title{font-size:14px;font-weight:600;margin-bottom:4px}
.timeline-desc{font-size:13px;color:var(--muted);margin-bottom:6px}
.ai-insight{font-size:13px;line-height:1.8;color:#374151;background:#f9fafb;padding:16px;border-radius:8px;border-left:4px solid #7c3aed}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-header h2{font-size:18px;margin:0}
.page-header p{font-size:13px;color:var(--muted);margin:4px 0 0}
form label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--muted);margin-top:10px}
form input,form select,form textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;box-sizing:border-box}
form textarea{min-height:60px;resize:vertical}
form button{margin-top:16px}
.detail p{font-size:13px;margin:8px 0;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <a class="back" href="/web">&larr; 返回首页</a>
  <h1>个人健康档案</h1>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="overview">概览</button>
  <button class="tab" data-tab="encounters">就诊记录</button>
  <button class="tab" data-tab="conditions">健康问题</button>
  <button class="tab" data-tab="medications">用药记录</button>
  <button class="tab" data-tab="labs">化验结果</button>
  <button class="tab" data-tab="procedures">检查记录</button>
  <button class="tab" data-tab="allergies">过敏史</button>
  <button class="tab" data-tab="vitals">生命体征</button>
  <button class="tab" data-tab="immunizations">疫苗接种</button>
  <button class="tab" data-tab="timeline">健康时间线</button>
  <button class="tab" data-tab="documents">文档资料</button>
  <button class="tab" data-tab="doctors">医生信息</button>
  <button class="tab" data-tab="appointments">预约复诊</button>
  <button class="tab" data-tab="medication-logs">服药记录</button>
</div>

<div class="container" id="content"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const API = '/api/health';
let currentPatientId = null;
let stats = null;

async function api(path, opts={}) {
  const res = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  return res.json();
}

function fmtDate(d){ return d ? d.slice(0,10) : '-'; }

function badge(type, val){
  const map = {
    active:'badge-active', inactive:'badge-inactive', resolved:'badge-resolved', chronic:'badge-chronic',
    high:'badge-high', low:'badge-low', normal:'badge-normal',
    outpatient:'badge-outpatient', emergency:'badge-emergency',
  };
  return `<span class="badge ${map[val]||'badge-inactive'}">${val}</span>`;
}

// ── Tabs ──
document.getElementById('tabs').addEventListener('click', e => {
  if(e.target.classList.contains('tab')){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    renderTab(e.target.dataset.tab);
  }
});

async function renderTab(tab){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">加载中...</div>';
  switch(tab){
    case 'overview': await renderOverview(); break;
    case 'encounters': await renderEncounters(); break;
    case 'conditions': await renderConditions(); break;
    case 'medications': await renderMedications(); break;
    case 'labs': await renderLabs(); break;
    case 'procedures': await renderProcedures(); break;
    case 'allergies': await renderAllergies(); break;
    case 'vitals': await renderVitals(); break;
    case 'immunizations': await renderImmunizations(); break;
    case 'timeline': await renderTimeline(); break;
    case 'documents': await renderDocuments(); break;
    case 'doctors': await renderDoctors(); break;
    case 'appointments': await renderAppointments(); break;
    case 'medication-logs': await renderMedicationLogs(); break;
  }
}

// ── Overview ──
async function renderOverview(){
  const el = document.getElementById('content');
  const [statsRes, patientsRes] = await Promise.all([
    api('/stats'), api('/patients')
  ]);
  stats = statsRes.stats;
  const patients = patientsRes.items || [];
  if(patients.length > 0 && !currentPatientId) currentPatientId = patients[0].id;

  let html = '<div class="stats-grid">';
  html += statCard('就诊总次数', stats.total_encounters);
  html += statCard('活跃健康问题', stats.active_conditions, 'warning');
  html += statCard('当前用药', stats.active_medications, 'success');
  html += statCard('化验报告', stats.total_lab_results);
  html += statCard('检查记录', stats.total_procedures);
  html += statCard('待复查', stats.pending_follow_ups, 'danger');
  html += statCard('文档资料', stats.total_documents || 0);
  html += statCard('医生信息', stats.total_doctors || 0);
  html += statCard('即将预约', stats.upcoming_appointments || 0);
  html += statCard('服药记录', stats.total_medication_logs || 0);
  html += statCard('过敏史', stats.total_allergies);
  html += statCard('疫苗接种', stats.total_immunizations);
  html += '</div>';

  // Patient selector
  if(patients.length > 1){
    html += '<div class="card"><h2>选择档案成员</h2><div style="display:flex;gap:10px;flex-wrap:wrap">';
    patients.forEach(p => {
      html += `<button class="btn ${p.id===currentPatientId?'btn-primary':''}" onclick="selectPatient(${p.id})">${p.full_name}${p.relationship!=='self'?'('+p.relationship+')':''}</button>`;
    });
    html += '</div></div>';
  }

  // Active conditions
  if(currentPatientId){
    const [condRes, medRes, procRes] = await Promise.all([
      api(`/conditions?patient_id=${currentPatientId}&status=active`),
      api(`/medications?patient_id=${currentPatientId}&status=active`),
      api(`/procedures?patient_id=${currentPatientId}&needs_follow_up=true`),
    ]);
    html += '<div class="card"><h2>当前健康问题</h2>';
    if(condRes.items?.length){
      html += '<table><tr><th>问题</th><th>严重程度</th><th>发现日期</th><th>备注</th></tr>';
      condRes.items.forEach(c => {
        html += `<tr><td><strong>${c.condition_name}</strong><br><small style="color:var(--muted)">${c.diagnosis||''}</small></td><td>${c.severity?badge('severity',c.severity):'-'}</td><td>${fmtDate(c.onset_date)}</td><td>${c.notes||'-'}</td></tr>`;
      });
      html += '</table>';
    } else html += '<div class="empty">暂无活跃健康问题</div>';
    html += '</div>';

    html += '<div class="card"><h2>当前用药</h2>';
    if(medRes.items?.length){
      html += '<table><tr><th>药品</th><th>剂量</th><th>频率</th><th>适应症</th></tr>';
      medRes.items.forEach(m => {
        html += `<tr><td><strong>${m.medication_name}</strong></td><td>${m.dosage||'-'}</td><td>${m.frequency||'-'}</td><td>${m.indication||'-'}</td></tr>`;
      });
      html += '</table>';
    } else html += '<div class="empty">暂无当前用药</div>';
    html += '</div>';

    if(procRes.items?.length){
      html += '<div class="card"><h2 style="color:var(--danger)">待复查提醒</h2><table><tr><th>检查</th><th>日期</th><th>复查建议</th></tr>';
      procRes.items.forEach(p => {
        html += `<tr><td><strong>${p.procedure_name}</strong></td><td>${fmtDate(p.procedure_date)}</td><td>${p.follow_up_recommendation||'建议复查'}</td></tr>`;
      });
      html += '</table></div>';
    }
  }
  el.innerHTML = html;
}

function statCard(label, value, cls=''){
  return `<div class="stat-card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`;
}

window.selectPatient = function(id){ currentPatientId = id; renderTab('overview'); };

// ── Encounters ──
async function renderEncounters(){
  const el = document.getElementById('content');
  const res = await api(`/encounters${currentPatientId?'?patient_id='+currentPatientId:''}?limit=200`);
  let html = '<div class="card"><h2>就诊记录 <button class="btn btn-primary btn-sm" onclick="showEncounterForm()">+ 新增就诊</button></h2>';
  if(res.items?.length){
    html += '<table><tr><th>日期</th><th>医院</th><th>科室</th><th>类型</th><th>主诉</th><th>诊断</th><th>医生</th><th>操作</th></tr>';
    res.items.forEach(e => {
      html += `<tr><td>${fmtDate(e.encounter_date)}</td><td>${e.hospital||'-'}</td><td>${e.department||'-'}</td><td>${badge('type',e.encounter_type)}</td><td>${e.chief_complaint||'-'}</td><td>${e.diagnosis||'-'}</td><td>${e.doctor||'-'}</td><td><button class="btn btn-sm" onclick="viewEncounter(${e.id})">详情</button></td></tr>`;
    });
    html += '</table>';
  } else html += '<div class="empty">暂无就诊记录</div>';
  html += '</div>';
  el.innerHTML = html;
}

window.viewEncounter = async function(id){
  const res = await api('/encounters/'+id);
  const e = res.data;
  showModal(`就诊详情 - ${fmtDate(e.encounter_date)}`, `
    <div class="detail-row"><span class="key">日期</span><span class="val">${fmtDate(e.encounter_date)}</span></div>
    <div class="detail-row"><span class="key">医院</span><span class="val">${e.hospital||'-'}</span></div>
    <div class="detail-row"><span class="key">科室</span><span class="val">${e.department||'-'}</span></div>
    <div class="detail-row"><span class="key">医生</span><span class="val">${e.doctor||'-'}</span></div>
    <div class="detail-row"><span class="key">类型</span><span class="val">${badge('type',e.encounter_type)}</span></div>
    <div class="detail-row"><span class="key">主诉</span><span class="val">${e.chief_complaint||'-'}</span></div>
    <div class="detail-row"><span class="key">现病史</span><span class="val">${e.present_illness||'-'}</span></div>
    <div class="detail-row"><span class="key">体格检查</span><span class="val">${e.physical_exam||'-'}</span></div>
    <div class="detail-row"><span class="key">诊断</span><span class="val"><strong>${e.diagnosis||'-'}</strong></span></div>
    <div class="detail-row"><span class="key">治疗计划</span><span class="val">${e.treatment_plan||'-'}</span></div>
    <div class="detail-row"><span class="key">随访指示</span><span class="val">${e.follow_up_instructions||'-'}</span></div>
    <div class="detail-row"><span class="key">费用</span><span class="val">${e.cost_yuan!=null?'¥'+e.cost_yuan:'-'}</span></div>
    <div class="detail-row"><span class="key">备注</span><span class="val">${e.notes||'-'}</span></div>
    <div class="modal-actions"><button class="btn btn-danger" onclick="deleteItem('encounters',${e.id})">删除</button><button class="btn" onclick="closeModal()">关闭</button></div>
  `);
};

window.showEncounterForm = function(){
  showModal('新增就诊记录', `
    <div class="form-row">
      <div class="form-group"><label>日期 *</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>类型</label><select id="f_type"><option value="outpatient">门诊</option><option value="emergency">急诊</option><option value="inpatient">住院</option><option value="physical">体检</option><option value="follow_up">复查</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>医院</label><input id="f_hospital"></div>
      <div class="form-group"><label>科室</label><input id="f_dept"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>医生</label><input id="f_doctor"></div>
      <div class="form-group"><label>费用(元)</label><input type="number" id="f_cost"></div>
    </div>
    <div class="form-group"><label>主诉</label><input id="f_complaint"></div>
    <div class="form-group"><label>现病史</label><textarea id="f_illness"></textarea></div>
    <div class="form-group"><label>诊断</label><textarea id="f_diagnosis"></textarea></div>
    <div class="form-group"><label>治疗计划</label><textarea id="f_plan"></textarea></div>
    <div class="form-group"><label>随访指示</label><input id="f_followup"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitEncounter()">保存</button></div>
  `);
};

window.submitEncounter = async function(){
  const pid = currentPatientId || 1;
  await api('/encounters', {method:'POST', body:JSON.stringify({
    patient_id: pid,
    encounter_date: document.getElementById('f_date').value,
    encounter_type: document.getElementById('f_type').value,
    hospital: document.getElementById('f_hospital').value,
    department: document.getElementById('f_dept').value,
    doctor: document.getElementById('f_doctor').value,
    cost_yuan: parseFloat(document.getElementById('f_cost').value)||null,
    chief_complaint: document.getElementById('f_complaint').value,
    present_illness: document.getElementById('f_illness').value,
    diagnosis: document.getElementById('f_diagnosis').value,
    treatment_plan: document.getElementById('f_plan').value,
    follow_up_instructions: document.getElementById('f_followup').value,
  })});
  closeModal(); renderTab('encounters');
};

// ── Conditions ──
async function renderConditions(){
  const el = document.getElementById('content');
  const res = await api(`/conditions${currentPatientId?'?patient_id='+currentPatientId:''}&limit=200`);
  let html = '<div class="card"><h2>健康问题 <button class="btn btn-primary btn-sm" onclick="showConditionForm()">+ 新增问题</button></h2>';
  if(res.items?.length){
    html += '<table><tr><th>问题</th><th>状态</th><th>严重程度</th><th>发现日期</th><th>缓解日期</th><th>操作</th></tr>';
    res.items.forEach(c => {
      html += `<tr><td><strong>${c.condition_name}</strong><br><small style="color:var(--muted)">${c.diagnosis||''}</small></td><td>${badge('status',c.status)}</td><td>${c.severity?badge('severity',c.severity):'-'}</td><td>${fmtDate(c.onset_date)}</td><td>${fmtDate(c.resolved_date)}</td><td><button class="btn btn-sm btn-danger" onclick="deleteItem('conditions',${c.id})">删除</button></td></tr>`;
    });
    html += '</table>';
  } else html += '<div class="empty">暂无健康问题记录</div>';
  html += '</div>';
  el.innerHTML = html;
}

window.showConditionForm = function(){
  showModal('新增健康问题', `
    <div class="form-group"><label>问题名称 *</label><input id="f_name"></div>
    <div class="form-row">
      <div class="form-group"><label>状态</label><select id="f_status"><option value="active">活跃</option><option value="chronic">慢性</option><option value="resolved">已缓解</option><option value="inactive">不活跃</option></select></div>
      <div class="form-group"><label>严重程度</label><select id="f_severity"><option value="">-</option><option value="mild">轻度</option><option value="moderate">中度</option><option value="severe">重度</option><option value="critical">危重</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>发现日期</label><input type="date" id="f_onset"></div>
      <div class="form-group"><label>ICD-10编码</label><input id="f_icd"></div>
    </div>
    <div class="form-group"><label>详细诊断</label><textarea id="f_diag"></textarea></div>
    <div class="form-group"><label>备注</label><textarea id="f_notes"></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitCondition()">保存</button></div>
  `);
};

window.submitCondition = async function(){
  const sev = document.getElementById('f_severity').value;
  await api('/conditions', {method:'POST', body:JSON.stringify({
    patient_id: currentPatientId || 1,
    condition_name: document.getElementById('f_name').value,
    status: document.getElementById('f_status').value,
    severity: sev || null,
    onset_date: document.getElementById('f_onset').value || null,
    icd10_code: document.getElementById('f_icd').value,
    diagnosis: document.getElementById('f_diag').value,
    notes: document.getElementById('f_notes').value,
  })});
  closeModal(); renderTab('conditions');
};

// ── Medications ──
async function renderMedications(){
  const el = document.getElementById('content');
  const res = await api(`/medications${currentPatientId?'?patient_id='+currentPatientId:''}&limit=200`);

window.viewLab = async function(id){
  const res = await api('/lab-results/'+id);

    rows += `<tr class="${abn?'abnormal':''}"><td>${c.test_name}${c.abbreviation?` <small style="color:var(--muted)">(${c.abbreviation})</small>`:''}</td><td>${c.value!=null?c.value:c.qualitative_value||'-'}</td><td>${c.unit||'-'}</td><td>${c.ref_range_text||(c.ref_range_min!=null?c.ref_range_min+'~'+c.ref_range_max:'-')}</td><td>${badge('lab',c.status)}</td></tr>`;
  });
  showModal(`化验详情 - ${l.test_name}`, `

window.submitLab = async function(){
  const compText = document.getElementById('f_components').value;
  const components = [];
  compText.split('\n').forEach(line => {
    const parts = line.trim().split('|');
    if(parts.length >= 2 && parts[0]){
      components.push({
        test_name: parts[0].trim(),
        value: parts[1]?parseFloat(parts[1]):null,
        unit: parts[2]?.trim()||'',
        ref_range_min: parts[3]?parseFloat(parts[3]):null,
        ref_range_max: parts[4]?parseFloat(parts[4]):null,
        status: parts[5]?.trim()||'normal',
      });
    }
  });
  await api('/lab-results', {method:'POST', body:JSON.stringify({
    patient_id: currentPatientId || 1,
    test_name: document.getElementById('f_name').value,
    facility: document.getElementById('f_facility').value,
    test_category: document.getElementById('f_category').value,
    completed_date: document.getElementById('f_date').value,
    overall_interpretation: document.getElementById('f_interp').value,
    components,
  })});
  closeModal(); renderTab('labs');
};

  const typeMap = {
    encounter:{icon:'🏥',color:'#2563eb',label:'就诊'},
    procedure:{icon:'🔬',color:'#7c3aed',label:'检查'},
    lab:{icon:'🧪',color:'#0891b2',label:'化验'},
    medication:{icon:'💊',color:'#16a34a',label:'用药'},
    condition:{icon:'⚠️',color:'#dc2626',label:'健康问题'},

  };
  let html = '<div class="page-header"><h2>健康时间线</h2><p>按时间顺序展示所有健康事件</p></div>';
  if(events.length === 0){ html += '<div class="empty">暂无时间线数据</div>'; }
  else{
    html += '<div class="timeline">';
    let lastDate = '';
    events.forEach(ev => {
      const t = typeMap[ev.event_type] || {icon:'📌',color:'#6b7280',label:ev.event_type};
      const date = fmtDate(ev.date);
      if(date !== lastDate){
        html += `<div class="timeline-date">${date}</div>`;
        lastDate = date;
      }
      html += `<div class="timeline-item" style="border-left-color:${t.color}">
        <div class="timeline-icon" style="background:${t.color}">${t.icon}</div>
        <div class="timeline-content">
          <div class="timeline-title">${t.label} · ${ev.title}</div>
          ${ev.description ? `<div class="timeline-desc">${ev.description}</div>` : ''}
          ${ev.status ? `<span class="badge badge-inactive">${ev.status}</span>` : ''}
          ${ev.severity === 'warning' ? '<span class="badge badge-high">需关注</span>' : ''}
        </div>
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

  ]);
  const logs = logsRes.items || [];
  const meds = medsRes.items || [];

  let html = `<div class="section-header">
    <h2>服药记录 / 用药依从性</h2>
    <button class="btn-primary" onclick="showMedLogForm()">+ 记录服药</button>
  </div>`;

  if(adherenceRes.ok && adherenceRes.total_doses > 0){
    html += `<div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-value">${adherenceRes.adherence_rate}%</div><div class="stat-label">30天依从率</div></div>

      <div class="stat-card"><div class="stat-value">${adherenceRes.total_doses}</div><div class="stat-label">总记录</div></div>
    </div>`;
  }

  if(logs.length > 0){
    html += '<div class="card-list">';
    logs.forEach(l => {
      const statusColor = l.status === 'taken' ? 'badge-active' : l.status === 'missed' ? 'badge-high' : 'badge-inactive';
      html += `<div class="card">
        <div class="card-header">
          <strong>${l.medication_name}</strong>
          <span class="badge ${statusColor}">${l.status}</span>
        </div>

          <p>📆 ${l.scheduled_date} ${l.scheduled_time||''}</p>
          ${l.dosage ? `<p>💊 ${l.dosage}</p>` : ''}
          ${l.taken_at ? `<p>✅ 实际服用：${l.taken_at}</p>` : ''}

          <button class="btn-sm btn-danger" onclick="deleteMedLog(${l.id})">删除</button>
        </div>
      </div>`;
    });
    html += '</div>';
  } else {
    html += '<div class="empty">暂无服药记录，点击"记录服药"添加</div>';
  }

  // 药物相互作用检查
  if(meds.length > 0){
    const activeMeds = meds.filter(m => m.status === 'active');
    if(activeMeds.length > 1){
      html += '<h3 style="margin:20px 0 10px">⚠️ 药物相互作用检查</h3>';
      html += '<div class="card"><div class="card-body"><p>当前在用药物：' + activeMeds.map(m=>m.name).join('、') + '</p>';

      html += '<div id="interaction-result" style="margin-top:12px"></div></div></div>';
    }
  }

  el.innerHTML = html;
}

async function checkInteractions(){
  const medsRes = await api('/medications');
  const activeMeds = (medsRes.items||[]).filter(m=>m.status==='active');
  if(activeMeds.length < 2){ document.getElementById('interaction-result').innerHTML='<p>需要至少2种在用药物</p>'; return; }
  const result = document.getElementById('interaction-result');
  result.innerHTML = '<p>检查中...</p>';
  let allInteractions = [];
  for(let i=0; i<activeMeds.length; i++){
    const others = activeMeds.filter((_,j)=>j!==i).map(m=>m.name);
    const res = await api('/check-drug-interactions?drug_name='+encodeURIComponent(activeMeds[i].name)+'&existing_drugs='+encodeURIComponent(others.join(',')));
    if(res.interactions) allInteractions = allInteractions.concat(res.interactions);
  }
  // 去重
  const seen = new Set();
  const unique = allInteractions.filter(i => {
    const key = [i.drug_a, i.drug_b].sort().join('|');
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
  if(unique.length === 0){
    result.innerHTML = '<p style="color:#059669">✅ 未发现已知药物相互作用</p>';
  } else {
    result.innerHTML = unique.map(i =>
      `<div style="padding:10px;margin:8px 0;border-left:3px solid ${i.severity==='major'?'#dc2626':'#f59e0b'};background:${i.severity==='major'?'#fef2f2':'#fffbeb'}">
        <strong>${i.drug_a} + ${i.drug_b}</strong>
        <span class="badge ${i.severity==='major'?'badge-high':'badge-inactive'}">${i.severity}</span>
        <p style="margin:6px 0 0;font-size:13px">${i.description}</p>
      </div>`
    ).join('');
  }
}

// Init
(async function init(){
  const patientsRes = await api('/patients');
  if(patientsRes.items?.length === 0){
    // Auto-create self patient
    await api('/patients', {method:'POST', body:JSON.stringify({full_name:'本人', relationship:'self'})});
  }
  renderTab('overview');
})();
</script>
