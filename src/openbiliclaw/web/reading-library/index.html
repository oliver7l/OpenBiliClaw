<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>阅读库 · 古灵阁</title>
  <style>
    :root {
      /* 与桌面版 /web 同一套设计 token：近单色灰白黑 */
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #f2f2f3;
      --line-strong: #e4e4e7;
      --accent: #b5715c;
      --accent-soft: #f6f6f7;
      --chip: #f6f6f7;
      --radius: 10px;
      --content-max: 1180px;
      --hl: #fdf3d8;
      --hl-strong: #f7e3a8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      /* STKaiti/KaiTi 只覆盖中文字形，拉丁字母与数字会回退到后面的
         PingFang/system-ui 变成黑体。在楷体后插入 Georgia（衬线西文，
         与楷体书卷气质协调），让英文/数字也保持手写衬线风格。 */
      font-family: "STKaiti", "KaiTi", "楷体", Georgia, "Times New Roman", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, -apple-system, serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    /* button/select/option/input 默认用浏览器 UI 字体，显式继承以保持全页统一。 */
    button, select, option, input, textarea { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .rl-head {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.92);
      backdrop-filter: saturate(160%) blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 10px 20px;
    }
    .rl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; max-width: var(--content-max); margin: 0 auto; }
    .rl-bar > * { min-width: 0; }
    .rl-bar h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .5px; white-space: nowrap; }
    .rl-count { color: var(--faint); font-size: 12px; font-weight: 400; white-space: nowrap; }
    .rl-search { display: flex; gap: 6px; flex: 0 1 220px; min-width: 140px; }
    .rl-search input {
      flex: 1; padding: 7px 11px; border: 1px solid var(--line-strong);
      border-radius: var(--radius); background: var(--panel); color: var(--ink);
      font-size: 13px; outline: none; min-width: 0;
    }
    .rl-search input:focus { border-color: var(--accent); }
    .rl-search button {
      padding: 0 14px; border: 1px solid var(--accent); background: var(--accent);
      color: #fff; border-radius: var(--radius); cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .rl-search button:hover { opacity: .9; }
    .rl-filter {
      padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--panel); color: var(--ink); font-size: 13px; outline: none; white-space: nowrap;
    }
    .rl-filter:focus { border-color: var(--accent); }
    .rl-filter.rl-tag { flex: 0 0 110px; width: 110px; }

    .rl-shuffle {
      padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent-soft);
      color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .rl-shuffle:hover { background: var(--accent); color: #fff; }
    .rl-tools { display: flex; gap: 6px; }
    .rl-tool {
      font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; background: var(--panel);
    }
    .rl-tool:hover { border-color: var(--accent); color: var(--accent); }
    .rl-back-home {
      font-size: 13px; color: var(--accent); white-space: nowrap; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; background: var(--panel);
    }
    .rl-back-home:hover { border-color: var(--accent); text-decoration: none; }

    .rl-platforms {
      flex: 1 1 0;
      display: flex; flex-wrap: nowrap; gap: 8px;
      overflow-x: auto; scrollbar-width: none;
      padding: 0; min-width: 100px;
    }
    .rl-platforms::-webkit-scrollbar { display: none; }
    .rl-platforms[hidden] { display: none; }
    .rl-pchip {
      font-size: 13px; padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
      text-decoration: none; cursor: pointer; white-space: nowrap;
    }
    .rl-pchip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .rl-pchip .rl-pc { color: var(--faint); font-size: 11px; margin-left: 4px; }

    .rl-results {
      padding: 16px 24px 80px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
      max-width: var(--content-max);
      margin: 0 auto;
    }
    .rl-empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 60px 0; }
    .rl-card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
      padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
      display: flex; flex-direction: column; gap: 8px; min-height: 160px; position: relative;
    }
    .rl-card:hover { border-color: var(--line-strong); box-shadow: 0 2px 12px rgba(0,0,0,.04); }
    .rl-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rl-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: var(--accent-soft); color: var(--accent); white-space: nowrap;
    }
    .rl-fit {
      font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
      background: #f2efe9; color: #8a7a4f;
    }
    .rl-fit.hot { background: #f9f1e3; color: #a06a2c; }
    .rl-status-dot { font-size: 11px; color: var(--faint); }
    .rl-fav {
      border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1;
      color: var(--faint); padding: 2px 4px; border-radius: 6px;
    }
    .rl-fav:hover { background: var(--chip); }
    .rl-fav.on { color: var(--accent); }
    .rl-block {
      border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1;
      color: var(--faint); padding: 2px 4px; border-radius: 6px;
    }
    .rl-block:hover { color: var(--danger, #b0564f); background: color-mix(in oklab, var(--danger, #b0564f), transparent 90%); }
    .rl-origin,
    .rl-restore {
      font-size: 12px; line-height: 1.6; color: var(--muted); text-decoration: none;
      border: 1px solid var(--line-strong); border-radius: 20px; padding: 2px 9px;
      white-space: nowrap; background: var(--panel); cursor: pointer;
    }
    .rl-origin:hover,
    .rl-restore:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .rl-tool.is-active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .rl-card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .rl-meta { color: var(--muted); font-size: 12px; }
    .rl-meta .rl-author::before { content: " · "; }
    .rl-summary {
      color: var(--muted); font-size: 13px; margin: 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rl-ai { font-size: 12px; color: #8a6d4f; background: #faf6ef; border-radius: 8px; padding: 8px 10px; line-height: 1.55; }
    .rl-ai .rl-ai-tag { font-size: 11px; color: #a98f6d; }
    .rl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .rl-tagchip {
      font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--chip); color: var(--muted);
    }
    button.rl-tagchip { border: 0; font-family: inherit; cursor: pointer; }
    button.rl-tagchip:hover { color: var(--accent); }
    .rl-similar {
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
      border-radius: 20px; font-size: 11px; padding: 2px 8px; cursor: pointer;
    }
    .rl-similar:hover { color: var(--accent); border-color: var(--accent); }
    .rl-sim-row { cursor: pointer; }
    .rl-sim-row:hover .n { color: var(--accent); }
    .rl-spark { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin: 6px 0 10px; }
    .rl-spark i { flex: 1 1 0; min-width: 2px; background: var(--accent); opacity: .45; border-radius: 2px 2px 0 0; }
    .rl-spark i.zero { opacity: .12; }
    .rl-nobody { color: var(--faint); font-size: 12px; font-style: italic; }
    .rl-progress { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
    .rl-progress i { display: block; height: 100%; background: var(--accent); opacity: .55; }

    /* 每日简报（可折叠卡片） */
    .rl-brief {
      max-width: var(--content-max); margin: 14px auto -4px; padding: 0 24px;
    }
    .rl-brief[hidden] { display: none; }
    .rl-brief-head {
      width: 100%; display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
      padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--ink); text-align: left;
    }
    .rl-brief-head:hover { border-color: var(--line-strong); }
    .rl-brief-head .rl-brief-title { color: var(--accent); white-space: nowrap; }
    .rl-brief-head .rl-brief-summary { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl-brief-head .rl-brief-caret { color: var(--faint); white-space: nowrap; }
    .rl-brief-body {
      border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius) var(--radius);
      background: var(--panel); padding: 14px 16px; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .rl-brief-sec h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
    .rl-brief-sec .rl-brief-num { font-size: 22px; font-weight: 600; }
    .rl-brief-sec .rl-brief-cap { font-size: 12px; color: var(--muted); }
    .rl-brief-sec .rl-brief-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .rl-brief-sec .rl-brief-empty { color: var(--faint); font-size: 12px; font-style: italic; }
    .rl-brief-item {
      display: flex; align-items: baseline; gap: 6px; padding: 5px 0;
      border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px;
    }
    .rl-brief-item:last-child { border-bottom: none; }
    .rl-brief-item:hover .rl-brief-item-title { color: var(--accent); }
    .rl-brief-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl-brief-item .rl-brief-fit { color: #a06a2c; font-size: 11px; white-space: nowrap; }
    .rl-brief-item .rl-brief-src { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .rl-brief-upd { padding: 4px 0; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); line-height: 1.5; }
    .rl-brief-upd:last-child { border-bottom: none; }
    .rl-brief-upd .rl-brief-src-label { color: var(--accent); font-size: 11px; margin-right: 4px; }
    @media (max-width: 900px) {
      .rl-brief { padding: 0 16px; }
      .rl-brief-body { grid-template-columns: 1fr; }
    }

    .rl-pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 0 40px; }
    .rl-pager[hidden] { display: none; }
    .rl-pager button {
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
      border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px;
    }
    .rl-pager button:disabled { color: var(--faint); cursor: default; border-color: var(--line); }
    .rl-pager span { color: var(--muted); font-size: 13px; }

    /* Reader drawer */
    .rl-reader {
      position: fixed; inset: 0; z-index: 50; background: var(--bg);
      display: flex; flex-direction: column;
    }
    .rl-reader[hidden] { display: none; }
    .rl-reader-head {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .rl-reader-head .rl-back {
      border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px;
      padding: 6px 14px; cursor: pointer; font-size: 13px; color: var(--ink);
    }
    .rl-reader-head h2 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl-font { display: flex; align-items: center; gap: 2px; }
    .rl-font button {
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
      border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; line-height: 1.4;
    }
    .rl-font button:hover { border-color: var(--accent); color: var(--accent); }
    .rl-reader-body { flex: 1; overflow: auto; max-width: 820px; width: 100%; margin: 0 auto; padding: 22px 20px 60px; position: relative; }
    .rl-reader-body .rl-byline { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .rl-reader-body .rl-content { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.85; }
    .rl-reader-body .rl-content.empty { color: var(--faint); font-style: italic; }
    .rl-reader-body .rl-content mark {
      background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px;
      cursor: pointer; border-bottom: 1px solid var(--hl-strong);
    }
    .rl-reader-body .rl-content mark.has-note { background: var(--hl-strong); }
    .rl-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
    .rl-actions button {
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
      border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px;
    }
    .rl-actions button.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rl-actions .rl-open { margin-left: auto; border-color: var(--accent); color: var(--accent); }
    .rl-actions .rl-open[disabled] { color: var(--faint); border-color: var(--line); cursor: default; }
    .rl-actions .rl-fav { font-size: 13px; }
    .rl-actions .rl-fav.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

    /* 浮动高亮按钮 */
    .rl-hl-float {
      position: fixed; z-index: 70; background: var(--ink); color: #fff;
      border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
    }
    .rl-hl-float:hover { opacity: .9; }

    /* 笔记弹层 */
    .rl-note-box {
      position: fixed; z-index: 75; background: var(--panel); border: 1px solid var(--line-strong);
      border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.12); padding: 14px; width: 300px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .rl-note-box[hidden] { display: none; }
    .rl-note-box .rl-nb-quote { font-size: 12px; color: var(--muted); max-height: 64px; overflow: auto; line-height: 1.5; }
    .rl-note-box textarea {
      border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; font-size: 13px;
      resize: vertical; min-height: 60px; outline: none; font-family: inherit;
    }
    .rl-note-box textarea:focus { border-color: var(--accent); }
    .rl-note-box .rl-nb-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .rl-note-box button {
      border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px;
      padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink);
    }
    .rl-note-box button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* 侧栏弹层（每日建议 / 看板） */
    .rl-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(420px, 92vw);
      background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
      box-shadow: -8px 0 30px rgba(0,0,0,.06); transform: translateX(100%); transition: transform .22s ease;
    }
    .rl-drawer.open { transform: translateX(0); }
    .rl-drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .rl-drawer-head h2 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
    .rl-drawer-head button {
      border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px;
      padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink);
    }
    .rl-drawer-body { flex: 1; overflow: auto; padding: 16px 18px; }
    .rl-sug-card {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
      margin-bottom: 10px; cursor: pointer;
    }
    .rl-sug-card:hover { border-color: var(--line-strong); }
    .rl-sug-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; line-height: 1.45; }
    .rl-sug-card .rl-sug-meta { font-size: 12px; color: var(--muted); }
    .rl-sug-card .rl-sug-reason { font-size: 12px; color: #8a6d4f; margin-top: 6px; }
    .rl-stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .rl-stat {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    }
    .rl-stat .v { font-size: 22px; font-weight: 600; }
    .rl-stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rl-sub { font-size: 13px; font-weight: 500; margin: 16px 0 8px; }
    .rl-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .rl-row .n { color: var(--muted); }
    .rl-bar-wrap { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .rl-bar-wrap i { display: block; height: 100%; background: var(--accent); opacity: .5; border-radius: 3px; }
    .rl-toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px;
      opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 80;
    }
    .rl-toast.show { opacity: .92; }
  </style>
</head>
<body>
  <header class="rl-head">
    <div class="rl-bar">
      <h1 id="pageTitle">阅读库</h1>
      <a class="rl-back-home" id="backHome" href="/library/" hidden>← 全部</a>
      <span class="rl-count" id="totalCount"></span>
      <form class="rl-search" id="searchForm" autocomplete="off">
        <input id="q" type="search" placeholder="搜索标题 / 正文 / 标签 / 作者…" aria-label="搜索阅读库">
        <button type="submit">搜索</button>
      </form>
      <select id="sortSel" class="rl-filter" aria-label="排序方式">
        <option value="">按时间</option>
        <option value="relevance">按兴趣契合</option>
      </select>
      <select id="sourceSel" class="rl-filter" aria-label="来源筛选" hidden><option value="">全部来源</option></select>
      <select id="statusSel" class="rl-filter" aria-label="阅读状态">
        <option value="">全部状态</option>
        <option value="unread">未读</option>
        <option value="reading">在读</option>
        <option value="finished">读完</option>
        <option value="archived">归档</option>
      </select>
      <input id="tagInput" class="rl-filter rl-tag" type="text" placeholder="标签，如 算法" aria-label="标签过滤">
      <button class="rl-shuffle" id="shuffleBtn" type="button">换一批</button>
      <div class="rl-tools">
        <button class="rl-tool" id="suggestBtn" type="button">今日建议</button>
        <button class="rl-tool" id="autoTagBtn" type="button">补标签</button>
        <button class="rl-tool" id="statsBtn" type="button">看板</button>
        <button class="rl-tool" id="blockedBtn" type="button" aria-pressed="false">已屏蔽</button>
      </div>
      <nav class="rl-platforms" id="platforms"></nav>
    </div>
  </header>

  <section class="rl-brief" id="brief" hidden>
    <button class="rl-brief-head" id="briefToggle" type="button" aria-expanded="false">
      <span class="rl-brief-title">📜 每日简报</span>
      <span class="rl-brief-summary" id="briefSummary"></span>
      <span class="rl-brief-caret" id="briefCaret">展开 ▾</span>
    </button>
    <div class="rl-brief-body" id="briefBody" hidden></div>
  </section>

  <main class="rl-results" id="results"></main>
  <nav class="rl-pager" id="pager">
    <button id="prevBtn" type="button">上一页</button>
    <span id="pageInfo"></span>
    <button id="nextBtn" type="button">下一页</button>
  </nav>

  <aside class="rl-reader" id="reader" hidden>
    <div class="rl-reader-head">
      <button class="rl-back" id="readerBack" type="button">← 返回</button>
      <h2 id="readerTitle"></h2>
      <div class="rl-font">
        <button id="fontMinus" type="button" title="减小字号">A−</button>
        <button id="fontPlus" type="button" title="增大字号">A+</button>
      </div>
    </div>
    <div class="rl-reader-body" id="readerBody"></div>
    <div class="rl-actions">
      <button data-status="unread" type="button">未读</button>
      <button data-status="reading" type="button">在读</button>
      <button data-status="finished" type="button">读完</button>
      <button data-status="archived" type="button">归档</button>
      <button class="rl-fav" id="readerFav" type="button">收藏</button>
      <button id="readerAI" type="button">AI 摘要</button>
      <button class="rl-open" id="readerOpen" type="button">打开原网页 ↗</button>
    </div>
  </aside>

  <button class="rl-hl-float" id="hlFloat" type="button" hidden>记笔记</button>
  <div class="rl-note-box" id="noteBox" hidden>
    <div class="rl-nb-quote" id="nbQuote"></div>
    <textarea id="nbText" placeholder="写点想法（可选）…"></textarea>
    <div class="rl-nb-actions">
      <button id="nbCancel" type="button">取消</button>
      <button class="primary" id="nbSave" type="button">保存高亮</button>
    </div>
  </div>

  <aside class="rl-drawer" id="drawer">
    <div class="rl-drawer-head">
      <h2 id="drawerTitle"></h2>
      <button id="drawerClose" type="button">关闭</button>
    </div>
    <div class="rl-drawer-body" id="drawerBody"></div>
  </aside>

  <div class="rl-toast" id="toast"></div>

  <script>
  (function () {
    "use strict";

    var PLATFORM = (window.__SOURCE__ || "").trim();

    var SOURCE_LABELS = {
      xiaohongshu: "小红书", bilibili: "B站", zhihu: "知乎", youtube: "YouTube",
      xiaoyuzhou: "小宇宙", douyin: "抖音", wechat: "微信", rss: "RSS",
      v2ex: "V2EX", getnote: "GetNote", flomo: "flomo", wechat_book: "微信读书",
      douban: "豆瓣", reddit: "Reddit"
    };
    var STATUS_LABELS = { unread: "未读", reading: "在读", finished: "读完", archived: "归档", hidden: "已屏蔽" };

    var state = { q: "", source: PLATFORM, status: "", tag: "", offset: 0, limit: 30, total: 0, current: [], random: true, sort: "", blocked: false };
    var readerState = { id: 0, article: null, notes: [], percent: 0, lastSave: 0 };
    var FONT_KEY = "rl-font-size";

    var els = {
      pageTitle: document.getElementById("pageTitle"),
      backHome: document.getElementById("backHome"),
      total: document.getElementById("totalCount"),
      results: document.getElementById("results"),
      q: document.getElementById("q"),
      sourceSel: document.getElementById("sourceSel"),
      statusSel: document.getElementById("statusSel"),
      tagInput: document.getElementById("tagInput"),
      searchForm: document.getElementById("searchForm"),
      sortSel: document.getElementById("sortSel"),
      shuffleBtn: document.getElementById("shuffleBtn"),
      suggestBtn: document.getElementById("suggestBtn"),
      autoTagBtn: document.getElementById("autoTagBtn"),
      statsBtn: document.getElementById("statsBtn"),
      blockedBtn: document.getElementById("blockedBtn"),
      platforms: document.getElementById("platforms"),
      pager: document.getElementById("pager"),
      prev: document.getElementById("prevBtn"),
      next: document.getElementById("nextBtn"),
      pageInfo: document.getElementById("pageInfo"),
      reader: document.getElementById("reader"),
      readerTitle: document.getElementById("readerTitle"),
      readerBody: document.getElementById("readerBody"),
      readerBack: document.getElementById("readerBack"),
      readerOpen: document.getElementById("readerOpen"),
      readerFav: document.getElementById("readerFav"),
      readerAI: document.getElementById("readerAI"),
      fontMinus: document.getElementById("fontMinus"),
      fontPlus: document.getElementById("fontPlus"),
      hlFloat: document.getElementById("hlFloat"),
      noteBox: document.getElementById("noteBox"),
      nbQuote: document.getElementById("nbQuote"),
      nbText: document.getElementById("nbText"),
      nbCancel: document.getElementById("nbCancel"),
      nbSave: document.getElementById("nbSave"),
      drawer: document.getElementById("drawer"),
      drawerTitle: document.getElementById("drawerTitle"),
      drawerBody: document.getElementById("drawerBody"),
      drawerClose: document.getElementById("drawerClose"),
      brief: document.getElementById("brief"),
      briefToggle: document.getElementById("briefToggle"),
      briefSummary: document.getElementById("briefSummary"),
      briefCaret: document.getElementById("briefCaret"),
      briefBody: document.getElementById("briefBody"),
      toast: document.getElementById("toast")
    };

    // 平台页适配：固定来源、隐藏来源下拉与平台导航、显示返回
    if (PLATFORM) {
      els.pageTitle.textContent = "阅读库 · " + srcLabel(PLATFORM);
      document.title = "阅读库 · " + srcLabel(PLATFORM) + " · 古灵阁";
      els.backHome.hidden = false;
      els.sourceSel.hidden = true;
      els.platforms.hidden = true;
    }

    function srcLabel(t) { return SOURCE_LABELS[t] || t || "其他"; }
    function parseTags(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      try { var v = JSON.parse(raw); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function parseAiSummary(raw) {
      if (!raw) return null;
      if (typeof raw === "object") return raw;
      try { var v = JSON.parse(raw); return v && typeof v === "object" ? v : null; }
      catch (e) { return null; }
    }
    function esc(s) { return String(s == null ? "" : s); }
    function fmtDate(s) {
      if (!s) return "";
      s = String(s).replace("T", " ").slice(0, 16);
      return s;
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { els.toast.classList.remove("show"); }, 1600);
    }

    function apiParams() {
      var p = new URLSearchParams();
      if (state.q) p.set("q", state.q);
      if (state.source) p.set("source_type", state.source);
      if (state.blocked) p.set("status", "hidden");
      else if (state.status) p.set("status", state.status);
      if (state.tag) p.set("tag", state.tag);
      var isRandom = !state.q && state.random && !state.blocked;
      p.set("random", isRandom ? "1" : "0");
      p.set("limit", isRandom ? 10 : 30);
      p.set("offset", isRandom ? 0 : state.offset);
      if (state.sort && !state.q) p.set("sort", state.sort);
      return p.toString();
    }

    function loadFacets() {
      fetch("/api/articles/facets").then(function (r) { return r.json(); }).then(function (d) {
        var frag = document.createDocumentFragment();
        (d.source_types || []).forEach(function (s) {
          var o = document.createElement("option");
          o.value = s.type;
          o.textContent = srcLabel(s.type) + " (" + s.count + ")";
          frag.appendChild(o);
        });
        els.sourceSel.appendChild(frag);
        state.total = d.total || 0;
        els.total.textContent = d.total ? "· 共 " + d.total.toLocaleString() + " 篇" : "";
        renderPlatforms(d.source_types || []);
      }).catch(function () { /* facets 失败不阻塞 */ });
    }

    function renderPlatforms(list) {
      if (PLATFORM) return;
      els.platforms.innerHTML = "";
      list.forEach(function (s) {
        var a = document.createElement("a");
        a.className = "rl-pchip";
        a.href = "/library/" + encodeURIComponent(s.type);
        a.textContent = srcLabel(s.type);
        var c = document.createElement("span");
        c.className = "rl-pc";
        c.textContent = s.count.toLocaleString();
        a.appendChild(c);
        els.platforms.appendChild(a);
      });
    }

    function load() {
      var isRandom = !state.q && state.random && !state.blocked;
      els.shuffleBtn.hidden = !isRandom;
      els.pager.hidden = isRandom;
      els.results.innerHTML = '<div class="rl-empty">加载中…</div>';
      fetch("/api/articles?" + apiParams()).then(function (r) { return r.json(); }).then(function (d) {
        var items = d.items || [];
        state.current = items;
        if (typeof d.total === "number") state.total = d.total;
        render(items);
        updatePager(items.length);
        window.scrollTo(0, 0);
      }).catch(function (e) {
        els.results.innerHTML = '<div class="rl-empty">加载失败：' + esc(e.message || e) + "</div>";
      });
    }

    function emptyText() {
      return state.blocked
        ? "没有已屏蔽的内容"
        : (state.q ? "没有匹配「" + state.q + "」的内容" : "暂无内容");
    }

    function render(items) {
      els.results.innerHTML = "";
      if (!items.length) {
        var empty = document.createElement("div");
        empty.className = "rl-empty";
        empty.textContent = emptyText();
        els.results.appendChild(empty);
        return;
      }
      items.forEach(function (a) { els.results.appendChild(card(a)); });
    }

    /* 屏蔽/恢复把当前页最后一张卡移走后，网格会空着：收敛 offset 并重新
       加载——还有别的页就回到有效页，没有就自然落进空态文案。 */
    function reloadIfDrained() {
      if (els.results.children.length) return;
      state.offset = Math.max(0, Math.min(state.offset, state.total - state.limit));
      load();
    }

    function card(a) {
      var c = document.createElement("article");
      c.className = "rl-card";

      var top = document.createElement("div");
      top.className = "rl-card-top";
      var badge = document.createElement("span");
      badge.className = "rl-badge";
      badge.textContent = srcLabel(a.source_type);
      top.appendChild(badge);

      var right = document.createElement("span");
      right.style.display = "inline-flex";
      right.style.alignItems = "center";
      right.style.gap = "6px";
      if (a.fit_score && a.fit_score > 0) {
        var fit = document.createElement("span");
        fit.className = "rl-fit" + (a.fit_score >= 0.5 ? " hot" : "");
        fit.textContent = "契合 " + Math.round(a.fit_score * 100) + "%";
        fit.title = "与兴趣画像的契合度";
        right.appendChild(fit);
      }
      if (a.status && a.status !== "unread") {
        var st = document.createElement("span");
        st.className = "rl-status-dot";
        st.textContent = STATUS_LABELS[a.status] || a.status;
        right.appendChild(st);
      }
      var simBtn = document.createElement("button");
      simBtn.className = "rl-similar";
      simBtn.type = "button";
      simBtn.textContent = "相似";
      simBtn.title = "找库内相似文章";
      simBtn.setAttribute("aria-label", "查找库内相似文章");
      simBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        findSimilar(a);
      });
      right.appendChild(simBtn);
      var fav = document.createElement("button");
      fav.className = "rl-fav" + (a.favorited ? " on" : "");
      fav.textContent = a.favorited ? "★" : "☆";
      fav.title = a.favorited ? "取消收藏" : "收藏";
      fav.addEventListener("click", function (ev) {
        ev.stopPropagation();
        toggleFav(a, fav);
      });
      if (a.url) {
        var origin = document.createElement("a");
        origin.className = "rl-origin";
        origin.href = a.url;
        origin.target = "_blank";
        origin.rel = "noopener noreferrer";
        origin.textContent = "↗ 原文";
        origin.title = "在新标签页打开原文";
        origin.setAttribute("aria-label", "打开原文");
        origin.addEventListener("click", function (ev) { ev.stopPropagation(); });
        right.appendChild(origin);
      }
      right.appendChild(fav);
      if (state.blocked) {
        var restore = document.createElement("button");
        restore.className = "rl-restore";
        restore.type = "button";
        restore.textContent = "↩ 恢复";
        restore.title = "取消屏蔽，放回阅读库";
        restore.setAttribute("aria-label", "取消屏蔽，放回阅读库");
        restore.addEventListener("click", function (ev) {
          ev.stopPropagation();
          restoreArticle(a, c);
        });
        right.appendChild(restore);
      } else {
        var block = document.createElement("button");
        block.className = "rl-block";
        block.type = "button";
        block.textContent = "⊘";
        block.title = "屏蔽：以后不再出现";
        block.setAttribute("aria-label", "屏蔽此内容，以后不再出现");
        block.addEventListener("click", function (ev) {
          ev.stopPropagation();
          blockArticle(a, c);
        });
        right.appendChild(block);
      }
      top.appendChild(right);
      c.appendChild(top);

      var h = document.createElement("h3");
      h.textContent = a.title || "(无标题)";
      c.appendChild(h);

      var meta = document.createElement("div");
      meta.className = "rl-meta";
      var by = document.createElement("span");
      by.textContent = fmtDate(a.published_at);
      meta.appendChild(by);
      if (a.author) {
        var au = document.createElement("span");
        au.className = "rl-author";
        au.textContent = a.author;
        meta.appendChild(au);
      }
      c.appendChild(meta);

      var ai = parseAiSummary(a.ai_summary);
      if (ai && ai.one_liner) {
        var aiBox = document.createElement("div");
        aiBox.className = "rl-ai";
        aiBox.innerHTML = '<span class="rl-ai-tag">AI 摘要 · </span>' + esc(ai.one_liner);
        c.appendChild(aiBox);
      }

      var hasBody = a.content_text && String(a.content_text).length > 10;
      if (hasBody && a.summary) {
        var sum = document.createElement("div");
        sum.className = "rl-summary";
        sum.textContent = a.summary;
        c.appendChild(sum);
      } else if (!hasBody) {
        var nb = document.createElement("div");
        nb.className = "rl-nobody";
        nb.textContent = "无正文 · 可点开查看原网页";
        c.appendChild(nb);
      }

      var tags = parseTags(a.tags);
      if (tags.length) {
        var tw = document.createElement("div");
        tw.className = "rl-tags";
        tags.slice(0, 8).forEach(function (t) {
          var tc = document.createElement("button");
          tc.className = "rl-tagchip";
          tc.type = "button";
          tc.textContent = t;
          tc.title = "按标签「" + t + "」筛选";
          tc.addEventListener("click", function (ev) {
            ev.stopPropagation();
            els.tagInput.value = t;
            state.tag = t;
            state.offset = 0;
            load();
          });
          tw.appendChild(tc);
        });
        c.appendChild(tw);
      }

      if (a.reading_percent && a.reading_percent > 0 && a.reading_percent < 100) {
        var pbar = document.createElement("div");
        pbar.className = "rl-progress";
        var pfill = document.createElement("i");
        pfill.style.width = Math.min(100, Math.round(a.reading_percent)) + "%";
        pbar.appendChild(pfill);
        c.appendChild(pbar);
      }

      c.addEventListener("click", function () { openReader(a.id); });
      return c;
    }

    function toggleFav(a, btn) {
      var next = !a.favorited;
      fetch("/api/articles/" + a.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ favorited: next })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          a.favorited = next;
          btn.classList.toggle("on", next);
          btn.textContent = next ? "★" : "☆";
          toast(next ? "已收藏" : "已取消收藏");
        } else { toast("操作失败"); }
      }).catch(function () { toast("操作失败"); });
    }

    function blockArticle(a, cardEl) {
      fetch("/api/articles/" + a.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "hidden" })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) { toast("屏蔽失败"); return; }
        if (cardEl && cardEl.parentNode) {
          cardEl.style.transition = "opacity .18s";
          cardEl.style.opacity = "0";
          var host = cardEl.parentNode;
          setTimeout(function () {
            if (cardEl.parentNode === host) host.removeChild(cardEl);
            reloadIfDrained();
          }, 180);
        }
        state.total = Math.max(0, (state.total || 1) - 1);
        els.total.textContent = state.total ? "· 共 " + state.total.toLocaleString() + " 篇" : "";
        var purged = d.purged_pool_count || 0;
        toast("已屏蔽，以后不再出现" + (purged > 0 ? "（同步清除推荐池 " + purged + " 条同类候选）" : ""));
      }).catch(function () { toast("屏蔽失败"); });
    }

    function restoreArticle(a, cardEl) {
      fetch("/api/articles/" + a.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "unread" })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) { toast("恢复失败"); return; }
        if (cardEl && cardEl.parentNode) {
          cardEl.style.transition = "opacity .18s";
          cardEl.style.opacity = "0";
          var host = cardEl.parentNode;
          setTimeout(function () {
            if (cardEl.parentNode === host) host.removeChild(cardEl);
            reloadIfDrained();
          }, 180);
        }
        state.total = Math.max(0, (state.total || 1) - 1);
        els.total.textContent = state.total ? "· 共 " + state.total.toLocaleString() + " 篇" : "";
        var revived = d.revived_pool_count || 0;
        toast("已恢复到阅读库" + (revived > 0 ? "（放回推荐池 " + revived + " 条候选）" : ""));
      }).catch(function () { toast("恢复失败"); });
    }

    function updatePager(n) {
      var hasMore = n >= state.limit;
      els.prev.disabled = state.offset <= 0;
      els.next.disabled = !hasMore;
      var start = state.total ? state.offset + 1 : 0;
      var end = state.offset + n;
      els.pageInfo.textContent = state.total ? (start + "–" + end + " / " + state.total.toLocaleString()) : (n ? (state.offset + 1) + "–" + end : "0");
    }

    /* ── 阅读器 ─────────────────────────────────────── */

    function openReader(id) {
      readerState.id = id;
      readerState.article = null;
      readerState.notes = [];
      readerState.percent = 0;
      els.readerBody.innerHTML = "加载中…";
      els.reader.hidden = false;
      els.readerBody.scrollTop = 0;
      Promise.all([
        fetch("/api/articles/" + id).then(function (r) { return r.json(); }),
        fetch("/api/articles/" + id + "/notes").then(function (r) { return r.json(); }).catch(function () { return { notes: [] }; })
      ]).then(function (res) {
        var d = res[0], nd = res[1];
        if (!d.ok || !d.article) { els.readerBody.textContent = "未找到该文章"; return; }
        var a = d.article;
        readerState.article = a;
        readerState.notes = nd.notes || [];
        els.readerTitle.textContent = a.title || "(无标题)";
        els.readerBody.innerHTML = "";

        var by = document.createElement("div");
        by.className = "rl-byline";
        by.textContent = [srcLabel(a.source_type), a.author, fmtDate(a.published_at)].filter(Boolean).join("  ·  ");
        els.readerBody.appendChild(by);

        var body = document.createElement("div");
        var hasBody = a.content_text && String(a.content_text).length > 10;
        body.className = "rl-content" + (hasBody ? "" : " empty");
        body.textContent = hasBody ? a.content_text : "该条目没有抓取到的正文，可打开原网页查看。";
        els.readerBody.appendChild(body);

        var tags = parseTags(a.tags);
        if (tags.length) {
          var tw = document.createElement("div");
          tw.className = "rl-tags";
          tw.style.marginTop = "18px";
          tags.forEach(function (t) {
            var tc = document.createElement("span");
            tc.className = "rl-tagchip";
            tc.textContent = t;
            tw.appendChild(tc);
          });
          els.readerBody.appendChild(tw);
        }

        applyHighlights(body);
        applyFont();

        // 恢复进度
        var pct = Number(a.reading_percent || 0);
        var prog = Number(a.reading_progress || 0);
        readerState.percent = pct;
        if (prog > 0 && hasBody) {
          setTimeout(function () {
            els.readerBody.scrollTop = prog;
          }, 30);
        }

        var url = a.url || "";
        var isWeb = /^https?:\/\//i.test(url);
        els.readerOpen.disabled = !isWeb;
        els.readerOpen.onclick = isWeb ? function () { window.open(url, "_blank", "noopener"); } : null;

        els.readerFav.classList.toggle("on", !!a.favorited);
        els.readerFav.textContent = a.favorited ? "★ 已收藏" : "☆ 收藏";
        els.readerFav.onclick = function () { toggleFav(a, els.readerFav); };

        var buttons = els.reader.querySelectorAll(".rl-actions button[data-status]");
        buttons.forEach(function (b) {
          b.classList.toggle("is-active", b.getAttribute("data-status") === (a.status || "unread"));
          b.onclick = function () { setStatus(id, b.getAttribute("data-status")); };
        });
      }).catch(function (e) {
        els.readerBody.textContent = "加载失败：" + (e.message || e);
      });
    }

    function applyHighlights(contentEl) {
      if (!readerState.notes.length) return;
      var html = contentEl.textContent;
      readerState.notes.forEach(function (n) {
        var q = n.quote;
        if (!q) return;
        var idx = html.indexOf(q);
        if (idx < 0) return;
        var mark = "<mark class='" + (n.note ? "has-note" : "") + "' data-note='" +
          esc(n.note || "").replace(/'/g, "&#39;") + "' data-quote='" + esc(q).replace(/'/g, "&#39;") + "'>" +
          esc(q) + "</mark>";
        html = html.slice(0, idx) + mark + html.slice(idx + q.length);
      });
      contentEl.innerHTML = html;
    }

    function saveProgress() {
      if (!readerState.article) return;
      var now = Date.now();
      if (now - readerState.lastSave < 800) return;
      readerState.lastSave = now;
      var el = els.readerBody;
      var max = el.scrollHeight - el.clientHeight;
      var pct = max > 0 ? Math.round((el.scrollTop / max) * 100) : 100;
      if (readerState.article.status === "finished") pct = 100;
      readerState.percent = pct;
      fetch("/api/articles/" + readerState.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percent: pct, progress: String(el.scrollTop) })
      }).catch(function () { /* 静默 */ });
    }

    function applyFont() {
      var size = parseInt(localStorage.getItem(FONT_KEY) || "15", 10);
      var el = els.readerBody.querySelector(".rl-content");
      if (el) el.style.fontSize = size + "px";
    }

    function setStatus(id, status) {
      fetch("/api/articles/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: status })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          toast("已标记为「" + (STATUS_LABELS[status] || status) + "」");
          var a = state.current.find(function (x) { return x.id === id; });
          if (a) a.status = status;
          if (readerState.article) readerState.article.status = status;
          els.reader.querySelectorAll(".rl-actions button[data-status]").forEach(function (b) {
            b.classList.toggle("is-active", b.getAttribute("data-status") === status);
          });
        } else {
          toast("标记失败：" + (d.error || "未知错误"));
        }
      }).catch(function (e) { toast("标记失败：" + (e.message || e)); });
    }

    /* ── 高亮笔记 ───────────────────────────────────── */

    function showHighlightFloat() {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) { hideHighlightFloat(); return; }
      var rect = sel.getRangeAt(0).getBoundingClientRect();
      els.hlFloat.hidden = false;
      els.hlFloat.style.left = Math.min(window.innerWidth - 90, Math.max(8, rect.left)) + "px";
      els.hlFloat.style.top = Math.max(8, rect.bottom + 6) + "px";
      els.hlFloat._text = sel.toString().trim();
    }
    function hideHighlightFloat() {
      els.hlFloat.hidden = true;
      els.hlFloat._text = "";
    }
    function openNoteBox() {
      var text = els.hlFloat._text || "";
      hideHighlightFloat();
      if (!text) return;
      els.nbQuote.textContent = "「" + text.slice(0, 120) + (text.length > 120 ? "…" : "") + "」";
      els.nbText.value = "";
      els.noteBox.hidden = false;
      els.nbText.focus();
      els.noteBox._quote = text;
      // 放在选中位置附近
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed) {
        var rect = sel.getRangeAt(0).getBoundingClientRect();
        els.noteBox.style.left = Math.min(window.innerWidth - 320, Math.max(8, rect.left)) + "px";
        els.noteBox.style.top = Math.max(8, rect.bottom + 8) + "px";
      } else {
        els.noteBox.style.left = "50%";
        els.noteBox.style.top = "30%";
        els.noteBox.style.transform = "translateX(-50%)";
      }
    }
    function saveNote() {
      var quote = els.noteBox._quote || "";
      var note = els.nbText.value.trim();
      if (!quote) { els.noteBox.hidden = true; return; }
      fetch("/api/articles/" + readerState.id + "/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quote: quote, note: note, color: "amber" })
      }).then(function (r) { return r.json(); }).then(function (d) {
        els.noteBox.hidden = true;
        if (d.ok) {
          toast("已高亮");
          readerState.notes.push({ quote: quote, note: note, color: "amber" });
          // 重新应用高亮
          var body = els.readerBody.querySelector(".rl-content");
          if (body) { applyHighlights(body); }
        } else { toast("保存失败"); }
      }).catch(function () { toast("保存失败"); });
    }

    /* ── AI 摘要 ────────────────────────────────────── */

    function requestSummary() {
      if (!readerState.id) return;
      els.readerAI.disabled = true;
      els.readerAI.textContent = "生成中…";
      fetch("/api/articles/" + readerState.id + "/summarize", { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          els.readerAI.disabled = false;
          els.readerAI.textContent = "AI 摘要";
          if (d.ok && d.summary) {
            renderSummaryDrawer(d.summary);
          } else {
            toast(d.error || "摘要生成失败");
          }
        })
        .catch(function () {
          els.readerAI.disabled = false;
          els.readerAI.textContent = "AI 摘要";
          toast("摘要生成失败");
        });
    }

    function renderSummaryDrawer(summary) {
      els.drawerTitle.textContent = "AI 摘要";
      els.drawerBody.innerHTML = "";
      var one = document.createElement("div");
      one.className = "rl-sub";
      one.textContent = "一句话总结";
      els.drawerBody.appendChild(one);
      var p = document.createElement("p");
      p.style.fontSize = "14px";
      p.style.margin = "0 0 6px";
      p.style.lineHeight = "1.7";
      p.textContent = summary.one_liner || "";
      els.drawerBody.appendChild(p);
      var pts = summary.points || [];
      if (pts.length) {
        var h2 = document.createElement("div");
        h2.className = "rl-sub";
        h2.textContent = "三个要点";
        els.drawerBody.appendChild(h2);
        var ol = document.createElement("ol");
        ol.style.paddingLeft = "20px";
        ol.style.margin = "0";
        pts.forEach(function (pt) {
          var li = document.createElement("li");
          li.style.fontSize = "13px";
          li.style.marginBottom = "6px";
          li.style.lineHeight = "1.6";
          li.textContent = pt;
          ol.appendChild(li);
        });
        els.drawerBody.appendChild(ol);
      }
      if (summary.generated_at) {
        var t = document.createElement("div");
        t.style.fontSize = "11px";
        t.style.color = "var(--faint)";
        t.style.marginTop = "14px";
        t.textContent = "生成于 " + summary.generated_at;
        els.drawerBody.appendChild(t);
      }
      els.drawer.classList.add("open");
    }

    /* ── 每日建议 / 看板 ────────────────────────────── */

    function openSuggestions() {
      els.drawerTitle.textContent = "今日建议";
      els.drawerBody.innerHTML = '<div class="rl-empty" style="padding:30px 0">加载中…</div>';
      els.drawer.classList.add("open");
      fetch("/api/reading/suggestions?limit=8").then(function (r) { return r.json(); }).then(function (d) {
        els.drawerBody.innerHTML = "";
        var items = (d.items || []).filter(function (it) { return it.id; });
        if (!items.length) {
          els.drawerBody.innerHTML = '<div class="rl-empty" style="padding:30px 0">未读池里还没找到高契合的内容，先逛逛阅读库吧</div>';
          return;
        }
        items.forEach(function (it) {
          var card = document.createElement("div");
          card.className = "rl-sug-card";
          var h = document.createElement("h3");
          h.textContent = it.title || "(无标题)";
          card.appendChild(h);
          var m = document.createElement("div");
          m.className = "rl-sug-meta";
          m.textContent = [srcLabel(it.source_type), it.author, fmtDate(it.published_at)].filter(Boolean).join(" · ");
          card.appendChild(m);
          if (it.fit_reason && it.fit_reason.length) {
            var r = document.createElement("div");
            r.className = "rl-sug-reason";
            r.textContent = "契合点：" + it.fit_reason.slice(0, 2).join("、");
            card.appendChild(r);
          }
          card.addEventListener("click", function () {
            els.drawer.classList.remove("open");
            openReader(it.id);
          });
          els.drawerBody.appendChild(card);
        });
      }).catch(function () {
        els.drawerBody.innerHTML = '<div class="rl-empty" style="padding:30px 0">加载失败</div>';
      });
    }

    function openStats() {
      els.drawerTitle.textContent = "阅读看板";
      els.drawerBody.innerHTML = '<div class="rl-empty" style="padding:30px 0">加载中…</div>';
      els.drawer.classList.add("open");
      fetch("/api/reading/stats").then(function (r) { return r.json(); }).then(function (d) {
        els.drawerBody.innerHTML = "";
        if (!d.ok) { els.drawerBody.innerHTML = '<div class="rl-empty">加载失败</div>'; return; }
        var st = d.stats || {};
        var bs = st.by_status || {};
        var grid = document.createElement("div");
        grid.className = "rl-stat-grid";
        [
          ["未读", bs.unread || 0],
          ["在读", bs.reading || 0],
          ["读完", bs.finished || 0],
          ["笔记", st.notes || 0]
        ].forEach(function (kv) {
          var box = document.createElement("div");
          box.className = "rl-stat";
          var v = document.createElement("div");
          v.className = "v";
          v.textContent = (kv[1] || 0).toLocaleString();
          var k = document.createElement("div");
          k.className = "k";
          k.textContent = kv[0];
          box.appendChild(v);
          box.appendChild(k);
          grid.appendChild(box);
        });
        els.drawerBody.appendChild(grid);

        var src = st.by_source || {};
        var srcKeys = Object.keys(src);
        if (srcKeys.length) {
          var h1 = document.createElement("div");
          h1.className = "rl-sub";
          h1.textContent = "来源分布";
          els.drawerBody.appendChild(h1);
          var total = srcKeys.reduce(function (s, k) { return s + src[k]; }, 0) || 1;
          srcKeys.slice(0, 6).forEach(function (k) {
            var row = document.createElement("div");
            row.className = "rl-row";
            var n = document.createElement("span");
            n.className = "n";
            n.textContent = srcLabel(k) + " " + src[k].toLocaleString();
            var pct = Math.round((src[k] / total) * 100);
            var p = document.createElement("span");
            p.textContent = pct + "%";
            row.appendChild(n);
            row.appendChild(p);
            els.drawerBody.appendChild(row);
            var wrap = document.createElement("div");
            wrap.className = "rl-bar-wrap";
            var fill = document.createElement("i");
            fill.style.width = pct + "%";
            wrap.appendChild(fill);
            els.drawerBody.appendChild(wrap);
          });
        }

        var month = st.by_month || {};
        var monthKeys = Object.keys(month).slice(0, 6);
        if (monthKeys.length) {
          var h2 = document.createElement("div");
          h2.className = "rl-sub";
          h2.textContent = "最近读完";
          els.drawerBody.appendChild(h2);
          monthKeys.forEach(function (k) {
            var row = document.createElement("div");
            row.className = "rl-row";
            var n = document.createElement("span");
            n.className = "n";
            n.textContent = k;
            var p = document.createElement("span");
            p.textContent = month[k] + " 篇";
            row.appendChild(n);
            row.appendChild(p);
            els.drawerBody.appendChild(row);
          });
        }

        var wk = st.by_week || {};
        var wkKeys = Object.keys(wk);
        if (wkKeys.length) {
          var hW = document.createElement("div");
          hW.className = "rl-sub";
          hW.textContent = "每周读完（近 " + wkKeys.length + " 周）";
          els.drawerBody.appendChild(hW);
          var maxW = Math.max.apply(null, wkKeys.map(function (k) { return wk[k]; })) || 1;
          wkKeys.forEach(function (k) {
            var row = document.createElement("div");
            row.className = "rl-row";
            var n = document.createElement("span");
            n.className = "n";
            n.textContent = k.replace(/^(\d{4})-W(\d+)$/, "$1 第$2 周");
            var p = document.createElement("span");
            p.textContent = wk[k] + " 篇";
            row.appendChild(n);
            row.appendChild(p);
            els.drawerBody.appendChild(row);
            var wrap = document.createElement("div");
            wrap.className = "rl-bar-wrap";
            var fill = document.createElement("i");
            fill.style.width = Math.round((wk[k] / maxW) * 100) + "%";
            wrap.appendChild(fill);
            els.drawerBody.appendChild(wrap);
          });
        }

        var tl = st.timeline || [];
        if (tl.length) {
          var hT = document.createElement("div");
          hT.className = "rl-sub";
          hT.textContent = "近 60 天 · 每日读完";
          els.drawerBody.appendChild(hT);
          var byDate = {};
          tl.forEach(function (pt) { byDate[pt.date] = pt.count; });
          var pts = [];
          var now = new Date();
          for (var i = 59; i >= 0; i--) {
            var dd = new Date(now.getTime() - i * 86400000);
            var key = dd.getUTCFullYear() + "-" +
              String(dd.getUTCMonth() + 1).padStart(2, "0") + "-" +
              String(dd.getUTCDate()).padStart(2, "0");
            pts.push({ date: key, count: byDate[key] || 0 });
          }
          var maxC = Math.max.apply(null, pts.map(function (p) { return p.count; })) || 1;
          var spark = document.createElement("div");
          spark.className = "rl-spark";
          pts.forEach(function (p) {
            var b = document.createElement("i");
            b.style.height = (p.count > 0 ? Math.max(12, Math.round((p.count / maxC) * 100)) : 4) + "%";
            if (!p.count) b.className = "zero";
            b.title = p.date + "：" + p.count + " 篇";
            spark.appendChild(b);
          });
          els.drawerBody.appendChild(spark);
        }

        var top = st.top_tags || [];
        if (top.length) {
          var h3 = document.createElement("div");
          h3.className = "rl-sub";
          h3.textContent = "高频标签";
          els.drawerBody.appendChild(h3);
          var tw = document.createElement("div");
          tw.style.display = "flex";
          tw.style.flexWrap = "wrap";
          tw.style.gap = "6px";
          top.forEach(function (kv) {
            var tc = document.createElement("span");
            tc.className = "rl-tagchip";
            tc.textContent = kv[0] + " ×" + kv[1];
            tw.appendChild(tc);
          });
          els.drawerBody.appendChild(tw);
        }
      }).catch(function () {
        els.drawerBody.innerHTML = '<div class="rl-empty">加载失败</div>';
      });
    }

    function findSimilar(a) {
      els.drawerTitle.textContent = "相似文章 · " + String(a.title || "").slice(0, 20);
      els.drawerBody.innerHTML = '<div class="rl-empty" style="padding:30px 0">计算相似度…</div>';
      els.drawer.classList.add("open");
      fetch("/api/reading/similar?id=" + a.id + "&k=8").then(function (r) { return r.json(); }).then(function (d) {
        els.drawerBody.innerHTML = "";
        var items = (d && d.items) || [];
        if (!d.ok || !items.length) {
          els.drawerBody.innerHTML = '<div class="rl-empty">库里暂时没有相似的文章（补标签后会更准）</div>';
          return;
        }
        items.forEach(function (it) {
          var pct = Math.round((it.similarity || 0) * 100);
          var row = document.createElement("div");
          row.className = "rl-row rl-sim-row";
          var t = document.createElement("span");
          t.className = "n";
          t.textContent = it.title || "(无标题)";
          var p = document.createElement("span");
          p.textContent = pct + "%";
          row.appendChild(t);
          row.appendChild(p);
          row.title = "打开这篇";
          row.addEventListener("click", function () {
            els.drawer.classList.remove("open");
            openReader(it.id);
          });
          els.drawerBody.appendChild(row);
          var wrap = document.createElement("div");
          wrap.className = "rl-bar-wrap";
          var fill = document.createElement("i");
          fill.style.width = pct + "%";
          wrap.appendChild(fill);
          els.drawerBody.appendChild(wrap);
        });
      }).catch(function () {
        els.drawerBody.innerHTML = '<div class="rl-empty">加载失败</div>';
      });
    }

    function runAutoTag() {
      var btn = els.autoTagBtn;
      btn.disabled = true;
      var prev = btn.textContent;
      btn.textContent = "补标签…";
      fetch("/api/reading/auto-tag?only_sparse=true", { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok) { toast("补标签失败"); return; }
          if (d.note) { toast("画像还没就绪，先聊聊 / 点赞攒点兴趣再补标签"); return; }
          toast("扫描 " + (d.scanned || 0) + " 篇 · 为 " + (d.updated || 0) + " 篇新增 " + (d.added || 0) + " 个标签");
          if ((d.updated || 0) > 0) { state.offset = 0; load(); }
        })
        .catch(function () { toast("补标签失败"); })
        .then(function () {
          btn.disabled = false;
          btn.textContent = prev;
        });
    }

    /* ── 每日简报 ───────────────────────────────────── */

    function briefHeadline(d) {
      var parts = [];
      var finished = (d.reading && d.reading.finished_today) || 0;
      if (finished > 0) parts.push("今天读完 " + finished + " 篇");
      var learned = (d.profile && d.profile.updates && d.profile.updates.length) || 0;
      if (learned > 0) parts.push("画像学了 " + learned + " 件新事");
      var picks = (d.tomorrow && d.tomorrow.length) || 0;
      if (picks > 0) parts.push(picks + " 篇值得看");
      return parts.length ? parts.join(" · ") : "今天还没有新动静，先随便逛逛";
    }

    function briefTagChips(tags) {
      var tw = document.createElement("div");
      tw.className = "rl-brief-tags";
      tags.forEach(function (t) {
        var tc = document.createElement("span");
        tc.className = "rl-tagchip";
        tc.textContent = t;
        tw.appendChild(tc);
      });
      return tw;
    }

    function briefSection(title) {
      var sec = document.createElement("div");
      sec.className = "rl-brief-sec";
      var h = document.createElement("h4");
      h.textContent = title;
      sec.appendChild(h);
      return sec;
    }

    function renderBriefBody(d) {
      els.briefBody.innerHTML = "";

      // 板块一：今日阅读回顾
      var sec1 = briefSection("今日阅读回顾");
      var reading = d.reading || {};
      if (reading.finished_today > 0) {
        var num = document.createElement("div");
        num.innerHTML = '<span class="rl-brief-num">' + reading.finished_today + "</span>" +
          '<span class="rl-brief-cap"> 篇读完</span>';
        sec1.appendChild(num);
        var bySrc = reading.by_source || {};
        var srcKeys = Object.keys(bySrc);
        if (srcKeys.length) {
          var cap = document.createElement("div");
          cap.className = "rl-brief-cap";
          cap.textContent = srcKeys
            .sort(function (a, b) { return bySrc[b] - bySrc[a]; })
            .map(function (k) { return srcLabel(k) + " " + bySrc[k]; })
            .join(" · ");
          sec1.appendChild(cap);
        }
        if ((reading.top_topics || []).length) {
          sec1.appendChild(briefTagChips(reading.top_topics));
        }
      } else {
        var e1 = document.createElement("div");
        e1.className = "rl-brief-empty";
        e1.textContent = "今天还没标记读完的文章";
        sec1.appendChild(e1);
      }
      els.briefBody.appendChild(sec1);

      // 板块二：画像今天学到什么
      var sec2 = briefSection("画像今天学到什么");
      var updates = (d.profile && d.profile.updates) || [];
      if (updates.length) {
        updates.forEach(function (u) {
          var row = document.createElement("div");
          row.className = "rl-brief-upd";
          if (u.source_label) {
            var lab = document.createElement("span");
            lab.className = "rl-brief-src-label";
            lab.textContent = u.source_label;
            row.appendChild(lab);
          }
          row.appendChild(document.createTextNode(u.summary));
          sec2.appendChild(row);
        });
      } else {
        var e2 = document.createElement("div");
        e2.className = "rl-brief-empty";
        e2.textContent = "画像今天暂时没有新的认知更新";
        sec2.appendChild(e2);
      }
      els.briefBody.appendChild(sec2);

      // 板块三：明日值得看
      var sec3 = briefSection("明日值得看");
      var picks = d.tomorrow || [];
      if (picks.length) {
        picks.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "rl-brief-item";
          var t = document.createElement("span");
          t.className = "rl-brief-item-title";
          t.textContent = it.title || "(无标题)";
          row.appendChild(t);
          if (it.fit_score && it.fit_score > 0) {
            var f = document.createElement("span");
            f.className = "rl-brief-fit";
            f.textContent = "契合 " + Math.round(it.fit_score * 100) + "%";
            row.appendChild(f);
          }
          var s = document.createElement("span");
          s.className = "rl-brief-src";
          s.textContent = srcLabel(it.source_type);
          row.appendChild(s);
          row.title = "点击打开阅读";
          row.addEventListener("click", function () {
            if (it.id) { els.drawer.classList.remove("open"); openReader(it.id); }
          });
          sec3.appendChild(row);
        });
      } else {
        var e3 = document.createElement("div");
        e3.className = "rl-brief-empty";
        e3.textContent = "未读池里暂无高契合内容";
        sec3.appendChild(e3);
      }
      els.briefBody.appendChild(sec3);
    }

    function loadBrief() {
      fetch("/api/reading/daily-brief").then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) return;
        els.briefSummary.textContent = briefHeadline(d);
        renderBriefBody(d);
        els.brief.hidden = false;
      }).catch(function () { /* 简报失败不阻塞列表 */ });
    }

    els.briefToggle.addEventListener("click", function () {
      var open = els.briefBody.hidden;
      els.briefBody.hidden = !open;
      els.briefCaret.textContent = open ? "收起 ▴" : "展开 ▾";
      els.briefToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    function closeReader() { els.reader.hidden = true; }

    // events
    els.searchForm.addEventListener("submit", function (e) {
      e.preventDefault();
      state.q = els.q.value.trim();
      state.tag = els.tagInput.value.trim();
      state.offset = 0;
      load();
    });
    els.shuffleBtn.addEventListener("click", function () { state.offset = 0; load(); });
    els.sourceSel.addEventListener("change", function () { state.source = els.sourceSel.value; state.offset = 0; load(); });
    els.statusSel.addEventListener("change", function () { state.status = els.statusSel.value; state.offset = 0; load(); });
    els.sortSel.addEventListener("change", function () {
      state.sort = els.sortSel.value;
      state.random = false;
      state.offset = 0;
      load();
    });
    els.tagInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); state.tag = els.tagInput.value.trim(); state.offset = 0; load(); }
    });
    els.prev.addEventListener("click", function () {
      if (state.offset <= 0) return;
      state.offset = Math.max(0, state.offset - state.limit);
      load();
    });
    els.next.addEventListener("click", function () { state.offset += state.limit; load(); });
    els.readerBack.addEventListener("click", closeReader);
    els.suggestBtn.addEventListener("click", openSuggestions);
    els.autoTagBtn.addEventListener("click", runAutoTag);
    els.statsBtn.addEventListener("click", openStats);
    els.blockedBtn.addEventListener("click", function () {
      state.blocked = !state.blocked;
      els.blockedBtn.classList.toggle("is-active", state.blocked);
      els.blockedBtn.setAttribute("aria-pressed", state.blocked ? "true" : "false");
      state.offset = 0;
      load();
    });
    els.drawerClose.addEventListener("click", function () { els.drawer.classList.remove("open"); });
    els.readerAI.addEventListener("click", requestSummary);
    els.fontMinus.addEventListener("click", function () {
      var size = parseInt(localStorage.getItem(FONT_KEY) || "15", 10);
      size = Math.max(13, size - 1);
      localStorage.setItem(FONT_KEY, String(size));
      applyFont();
    });
    els.fontPlus.addEventListener("click", function () {
      var size = parseInt(localStorage.getItem(FONT_KEY) || "15", 10);
      size = Math.min(24, size + 1);
      localStorage.setItem(FONT_KEY, String(size));
      applyFont();
    });
    els.hlFloat.addEventListener("click", openNoteBox);
    els.nbCancel.addEventListener("click", function () { els.noteBox.hidden = true; });
    els.nbSave.addEventListener("click", saveNote);

    // 滚动保存进度
    els.readerBody.addEventListener("scroll", saveProgress);
    // 选中文本 → 浮动高亮按钮
    document.addEventListener("mouseup", function (e) {
      if (els.reader.hidden) return;
      if (els.noteBox.hidden === false) return;
      if (els.hlFloat.contains(e.target)) return;
      setTimeout(showHighlightFloat, 10);
    });
    document.addEventListener("mousedown", function (e) {
      if (!els.hlFloat.contains(e.target) && !els.noteBox.contains(e.target)) {
        hideHighlightFloat();
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (!els.reader.hidden) closeReader();
        els.drawer.classList.remove("open");
        els.noteBox.hidden = true;
        hideHighlightFloat();
      }
    });

    loadFacets();
    loadBrief();
    load();
  })();
  </script>
</body>
</html>
