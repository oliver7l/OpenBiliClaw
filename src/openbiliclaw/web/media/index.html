<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒体浏览</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #1f2329;
    --muted: #8a9099;
    --accent: #4f7cff;
    --accent-soft: #eef2ff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  a { color: var(--accent); }

  /* ── 顶栏 ─────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 600; white-space: nowrap; }
  .root-tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
  .root-tab {
    border: 1px solid var(--border);
    background: #fbfbfc;
    color: var(--text);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  /* 选中态：仅文字变色 + 浅底，避免突兀的黑色块 */
  .root-tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .root-tab:hover { border-color: #c9cdd4; }
  .root-tab[data-gone="true"] { opacity: .5; }
  .badge { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .btn {
    border: 1px solid var(--border);
    background: #fbfbfc;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { border-color: #c9cdd4; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── 工具栏 ─────────────────────────────── */
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; background: #eceef2; padding: 3px; border-radius: 8px; }
  .seg button { border: none; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .seg button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .search { flex: 1; max-width: 260px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background:#fff; }
  .bread { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .bread a { cursor: pointer; }
  .bread .sep { color: #c9cdd4; }
  .spacer { flex: 1; }

  /* ── 卡片网格 ───────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 4px 16px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16,24,40,.12); }
  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #dfe4ea, #c9d1da);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    color: #fff;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; background: #e3e6ea; }
  .thumb .play {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(15,18,22,.55);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb .play svg { width: 20px; height: 20px; fill: #fff; }
  .fav-btn { position: absolute; top: 8px; left: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.5); border: none; color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
  .fav-btn.on { color: #ffd34d; }
  .del-btn { position: absolute; top: 8px; right: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.5); border: none; color: #fff; font-size: 13px; line-height: 1; cursor: pointer; opacity: .85; }
  .del-btn:hover { opacity: 1; color: #ff7875; }
  .rating { display: flex; gap: 2px; margin-top: 3px; align-items: center; }
  .star { cursor: pointer; font-size: 14px; line-height: 1; color: #d9d9d9; }
  .star.on { color: #ffb400; }
  .card .meta { padding: 9px 11px 11px; }
  .card .name { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .card.dir .thumb { background: linear-gradient(135deg, #eef2ff, #dbe3ff); color: var(--accent); }
  .card.dir .name { color: var(--accent); }

  /* ── 加载更多 / 空态 ───────────────────── */
  .load-row { display: flex; justify-content: center; padding: 8px 16px 26px; }
  .state { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

  /* ── 灯箱 / 视频弹窗 ───────────────────── */
  .modal { position: fixed; inset: 0; background: rgba(12,15,20,.82); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.open { display: flex; }
  .modal .close { position: absolute; top: 16px; right: 18px; color: #fff; background: rgba(255,255,255,.14); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; line-height: 1; }
  .modal img { max-width: 92vw; max-height: 90vh; border-radius: 6px; }
  .modal video { max-width: 94vw; max-height: 90vh; background: #000; border-radius: 6px; }
  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; background: rgba(255,255,255,.14); border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; }
  .nav-arrow.prev { left: 16px; } .nav-arrow.next { right: 16px; }
  .modal-note { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #ffd6a6; font-size: 13px; }

  /* ── 加目录小表单 ─────────────────────── */
  .add-row { display: none; align-items: center; gap: 8px; padding: 0 16px 12px; }
  .add-row.open { display: flex; }
  .add-row input { flex: 1; max-width: 460px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header class="topbar">
    <h1>媒体浏览</h1>
    <nav class="root-tabs" id="rootTabs"></nav>
    <button class="btn" id="addRootBtn" type="button">+ 添加目录</button>
  </header>

  <div class="add-row" id="addRow">
    <input id="newRootInput" type="text" placeholder="输入要添加的本地目录绝对路径，如 /Volumes/.../" autocomplete="off">
    <button class="btn primary" id="confirmAddBtn" type="button">确定</button>
    <button class="btn" id="cancelAddBtn" type="button">取消</button>
  </div>

  <div class="toolbar">
    <div class="seg" id="kindSeg">
      <button type="button" data-kind="all" class="active">全部</button>
      <button type="button" data-kind="video">视频</button>
      <button type="button" data-kind="image">图片</button>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="按文件名搜索…" autocomplete="off">
    <button class="btn" id="favToggleBtn" type="button">☆ 只看收藏</button>
    <button class="btn" id="randomBtn" type="button">🎲 随机播放</button>
    <button class="btn" id="refreshBtn" type="button">刷新</button>
  </div>

  <div class="bread" id="breadcrumb" hidden></div>

  <main id="gridBox"><div class="state" id="stateText">加载中…</div></main>

  <div class="load-row" id="loadRow" hidden><button class="btn" id="loadMoreBtn" type="button">加载更多</button></div>

  <!-- 图片灯箱 -->
  <div class="modal" id="imageModal">
    <button class="close" id="imageClose" type="button">✕</button>
    <button class="nav-arrow prev" id="imagePrev" type="button">‹</button>
    <img id="imageView" alt="图片预览">
    <button class="nav-arrow next" id="imageNext" type="button">›</button>
  </div>

  <!-- 视频弹窗 -->
  <div class="modal" id="videoModal">
    <button class="close" id="videoFav" type="button" title="收藏" style="right:66px">☆</button>
    <button class="close" id="videoClose" type="button">✕</button>
    <video id="videoView" controls autoplay></video>
    <div class="modal-note" id="videoNote" hidden></div>
  </div>

<script>
(function () {
  "use strict";

  var PAGE_SIZE = 60;

  var state = {
    roots: [],                 // roots_meta() 返回
    root: null,                // 当前根绝对路径
    sub: "",                   // 当前相对子目录
    kind: "all",
    q: "",
    favoriteView: false,
    items: [],                 // 当前已加载条目
    offset: 0,
    hasMore: true,
    loading: false,
    dataVersion: 0,            // 用于重置滚动增量加载
    randomMode: false,
    sequentialMode: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var gridBox = $("gridBox");
  var stateText = $("stateText");

  function fileUrl(root, rel) {
    return "/api/media/file?root=" + encodeURIComponent(root) + "&path=" + encodeURIComponent(rel);
  }
  function posterUrl(root, rel) {
    return "/api/media/poster?root=" + encodeURIComponent(root) + "&path=" + encodeURIComponent(rel);
  }

  function fmtSize(bytes) {
    if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
    if (bytes >= 1024) return (bytes / 1024).toFixed(0) + " KB";
    return bytes + " B";
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function currentRoot() {
    for (var i = 0; i < state.roots.length; i++) {
      if (state.roots[i].path === state.root) return state.roots[i];
    }
    return state.roots[0] || null;
  }

  /* ── 收藏 / 评级 ─────────────────────────── */
  function itemRoot(item) { return item.root || state.root; }
  function setItemState(item, payload) {
    return fetch("/api/media/item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ root: itemRoot(item), path: item.rel, favorite: payload.favorite, rating: payload.rating })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (b) { throw new Error(b.detail || "保存失败"); });
      return r.json();
    }).then(function (s) {
      item.favorite = s.favorite;
      item.rating = s.rating;
      refreshCard(item);
      if (state.favoriteView && !item.favorite) removeCard(item);
    }).catch(function (err) { alert("操作失败：" + err.message); });
  }
  function toggleFavorite(item, e) { if (e) e.stopPropagation(); setItemState(item, { favorite: item.favorite ? 0 : 1 }); }
  function setRating(item, n, e) { if (e) e.stopPropagation(); setItemState(item, { rating: item.rating === n ? 0 : n }); }
  function refreshCard(item) {
    var card = document.querySelector('[data-rel="' + CSS.escape(String(item.rel)) + '"]');
    if (card) card.replaceWith(renderCard(item));
  }
  function removeCard(item) {
    var card = document.querySelector('[data-rel="' + CSS.escape(String(item.rel)) + '"]');
    if (card) card.remove();
  }
  function deleteItem(item, e) {
    if (e) e.stopPropagation();
    if (!confirm("确定删除「" + item.name + "」？\n文件将移动到回收站 data/media_trash/，可手动找回。")) return;
    fetch("/api/media/item?root=" + encodeURIComponent(itemRoot(item)) + "&path=" + encodeURIComponent(item.rel), { method: "DELETE" })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (b) { throw new Error(b.detail || "删除失败"); });
        return r.json();
      })
      .then(function () {
        state.items = state.items.filter(function (i) { return i !== item; });
        removeCard(item);
      })
      .catch(function (err) { alert("删除失败：" + err.message); });
  }

  /* ── 随机播放 ───────────────────────────── */
  function randomVideos() { return state.items.filter(function (i) { return !i.is_dir && i.kind === "video"; }); }
  function startRandom() {
    var pool = randomVideos();
    if (!pool.length) { alert("当前列表没有可播放的视频"); return; }
    state.randomMode = true;
    document.title = "🎲 随机播放中…（关闭弹窗停止）";
    playRandomOnce();
  }
  function playRandomOnce() {
    var pool = randomVideos();
    if (!pool.length || !state.randomMode) return;
    var item = pool[Math.floor(Math.random() * pool.length)];
    var v = $("videoView");
    v.src = fileUrl(itemRoot(item), item.rel);
    $("videoModal").classList.add("open");
    v.onended = function () {
      if (!state.randomMode) return;
      var p = randomVideos();
      if (!p.length) { closeMedia($("videoModal")); state.randomMode = false; return; }
      var next = p[Math.floor(Math.random() * p.length)];
      v.src = fileUrl(itemRoot(next), next.rel);
      v.play();
    };
  }
  function stopRandom() {
    state.randomMode = false;
    document.title = "媒体浏览";
  }

  /* ── 列表顺序连播 ───────────────────────── */
  function videoList() { return state.items.filter(function (i) { return !i.is_dir && i.kind === "video"; }); }
  function startSequential() {
    var list = videoList();
    if (!list.length) { alert("当前列表没有可播放的视频"); return; }
    state.sequentialMode = true;
    document.title = "▶ 列表连播中…（关闭弹窗停止）";
    playSequentialAt(list, 0);
  }
  function playSequentialAt(list, idx) {
    if (!state.sequentialMode || idx >= list.length) { stopSequential(); closeMedia($("videoModal")); return; }
    var item = list[idx];
    var v = $("videoView");
    v.src = fileUrl(itemRoot(item), item.rel);
    $("videoModal").classList.add("open");
    v.onended = function () { playSequentialAt(list, idx + 1); };
  }
  function stopSequential() {
    state.sequentialMode = false;
    if (document.title.indexOf("▶") === 0) document.title = "媒体浏览";
  }

  /* ── 根目录 ─────────────────────────────── */
  function loadRoots() {
    return fetch("/api/media/roots").then(function (r) { return r.json(); }).then(function (body) {
      state.roots = body.roots || [];
      if (!state.root && state.roots.length) {
        var first = state.roots.find(function (r) { return r.exists; }) || state.roots[0];
        state.root = first.path;
      }
      renderRootTabs();
      if (state.root) { resetAndLoad(); }
      else { stateText.textContent = "尚未配置媒体目录 —— 点击右上角「添加目录」开始。"; renderRootTabs(); }
    }).catch(function () {
      stateText.textContent = "无法连接后端 API，请确认服务已启动。";
    });
  }

  function renderRootTabs() {
    var tabs = $("rootTabs");
    var current = state.root;
    state.roots.forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "root-tab" + (r.path === current ? " active" : "");
      b.dataset.gone = r.exists ? "false" : "true";
      b.title = r.path;
      b.textContent = r.name + (r.exists ? " " + r.video_count + "▸/" + r.image_count + "🖼" : " (不存在)");
      b.addEventListener("click", function () {
        if (state.root !== r.path) { state.root = r.path; state.sub = ""; renderRootTabs(); resetAndLoad(); }
      });
      tabs.appendChild(b);
    });
    if (!state.roots.length) tabs.innerHTML = "";
  }

  /* ── 列表加载 ───────────────────────────── */
  function paramsFor() {
    var p = new URLSearchParams();
    p.set("root", state.root);
    p.set("kind", state.kind);
    if (state.q) p.set("q", state.q);
    if (state.sub) p.set("sub", state.sub);
    p.set("offset", String(state.offset));
    p.set("limit", String(PAGE_SIZE));
    return p;
  }

  function resetAndLoad() {
    state.dataVersion++;
    state.items = [];
    state.offset = 0;
    state.hasMore = true;
    gridBox.innerHTML = "";
    stateText.textContent = "加载中…";
    gridBox.appendChild(stateText);
    renderBreadcrumb();
    loadNext(true);
  }

  function loadNext(reset) {
    if (state.loading) return;
    if (state.favoriteView) { loadFavorites(); return; }
    if (!state.root) return;
    state.loading = true;
    var version = state.dataVersion;
    fetch("/api/media/list?" + paramsFor().toString()).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (body) {
      if (version !== state.dataVersion) { state.loading = false; return; }
      state.items = state.items.concat(body.items);
      state.offset = body.offset + body.items.length;
      state.hasMore = !!body.hasMore;
      renderCards(reset || gridBox.querySelector("#grid"));
      $("loadRow").hidden = !state.hasMore;
      state.loading = false;
    }).catch(function (err) {
      if (version !== state.dataVersion) { state.loading = false; return; }
      stateText.textContent = "加载失败：" + err.message;
      state.loading = false;
    });
  }

  function loadFavorites() {
    state.loading = true;
    var version = state.dataVersion;
    var p = new URLSearchParams();
    p.set("kind", state.kind);
    if (state.q) p.set("q", state.q);
    fetch("/api/media/favorites?" + p.toString()).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (body) {
      if (version !== state.dataVersion) { state.loading = false; return; }
      state.items = body.items || [];
      state.hasMore = false;
      gridBox.innerHTML = "";
      $("loadRow").hidden = true;
      if (!state.items.length) {
        stateText.textContent = "还没有收藏的媒体 —— 点卡片左上角 ☆ 收藏，★ 表示已收藏。";
        gridBox.appendChild(stateText);
      } else {
        stateText.remove();
        var grid = document.createElement("div");
        grid.id = "grid";
        grid.className = "grid";
        gridBox.appendChild(grid);
        state.items.forEach(function (item) { grid.appendChild(renderCard(item)); });
      }
      state.loading = false;
    }).catch(function (err) {
      if (version !== state.dataVersion) { state.loading = false; return; }
      stateText.textContent = "加载收藏失败：" + err.message;
      state.loading = false;
    });
  }

  function renderCards(reset) {
    var grid = document.getElementById("grid");
    if (!grid || reset) {
      gridBox.innerHTML = "";
      grid = document.createElement("div");
      grid.id = "grid";
      grid.className = "grid";
      gridBox.appendChild(grid);
    }
    if (!state.items.length) {
      stateText.textContent = "该目录下没有符合条件的媒体文件。";
      return;
    }
    stateText.remove();
    state.items.forEach(function (item) { grid.appendChild(renderCard(item)); });
  }

  function renderCard(item) {
    var card = document.createElement("div");
    card.className = "card" + (item.is_dir ? " dir" : "");
    card.dataset.rel = String(item.rel || "");
    var thumb = document.createElement("div");
    thumb.className = "thumb";
    if (item.is_dir) {
      thumb.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v5H3V5zm0 6h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8z"/></svg>';
    } else if (item.kind === "image") {
      var img = document.createElement("img");
      img.loading = "lazy";
      img.src = fileUrl(itemRoot(item), item.rel);
      img.alt = item.name;
      thumb.appendChild(img);
    } else {
      var pimg = document.createElement("img");
      pimg.loading = "lazy";
      pimg.src = posterUrl(itemRoot(item), item.rel);
      pimg.alt = item.name;
      // 抽帧封面失败时退化为播放图标
      pimg.onerror = function () { if (pimg.parentNode) pimg.remove(); };
      thumb.appendChild(pimg);
      var pOverlay = document.createElement("span");
      pOverlay.className = "play";
      pOverlay.setAttribute("role", "img");
      pOverlay.setAttribute("aria-label", "播放");
      pOverlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
      thumb.appendChild(pOverlay);
    }
    if (!item.is_dir) {
      var fav = document.createElement("button");
      fav.type = "button";
      fav.className = "fav-btn " + (item.favorite ? "on" : "off");
      fav.title = item.favorite ? "取消收藏" : "收藏";
      fav.textContent = item.favorite ? "★" : "☆";
      fav.addEventListener("click", function (e) { toggleFavorite(item, e); });
      thumb.appendChild(fav);
      var del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.title = "删除（移入回收站）";
      del.textContent = "🗑";
      del.addEventListener("click", function (e) { deleteItem(item, e); });
      thumb.appendChild(del);
    }
    card.appendChild(thumb);

    var meta = document.createElement("div");
    meta.className = "meta";
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = item.name;
    meta.appendChild(name);
    if (!item.is_dir) {
      var stars = document.createElement("div");
      stars.className = "rating";
      for (var i = 1; i <= 5; i++) {
        (function (n) {
          var s = document.createElement("span");
          s.className = "star" + (item.rating >= n ? " on" : "");
          s.textContent = "★";
          s.addEventListener("click", function (e) { setRating(item, n, e); });
          stars.appendChild(s);
        })(i);
      }
      meta.appendChild(stars);
    }
    if (!item.is_dir) {
      var sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = (item.size ? fmtSize(item.size) : "") + (item.mtime ? " · " + fmtTime(item.mtime) : "");
      meta.appendChild(sub);
    }
    card.appendChild(meta);

    card.addEventListener("click", function () { openItem(item); });
    return card;
  }

  /* ── 面包屑 ─────────────────────────────── */
  function renderBreadcrumb() {
    var bc = $("breadcrumb");
    if (state.favoriteView || !state.sub) { bc.hidden = true; bc.innerHTML = ""; return; }
    bc.hidden = false;
    bc.innerHTML = "";
    var rootLink = document.createElement("a");
    rootLink.textContent = "根目录";
    rootLink.addEventListener("click", function () { state.sub = ""; resetAndLoad(); });
    bc.appendChild(rootLink);
    var parts = state.sub.split("/");
    var acc = "";
    parts.forEach(function (part, i) {
      bc.appendChild(document.createTextNode(" / "));
      var a = document.createElement("a");
      a.textContent = part;
      acc = acc ? acc + "/" + part : part;
      (function (target) {
        a.addEventListener("click", function () { state.sub = target; resetAndLoad(); });
      })(acc);
      if (i < parts.length - 1) bc.appendChild(a);
      else bc.appendChild(document.createTextNode(" " + part));
    });
  }

  /* ── 条目点击 ───────────────────────────── */
  function openItem(item) {
    if (item.is_dir) { state.sub = item.rel; resetAndLoad(); return; }
    if (item.kind === "video") openVideo(item);
    else openImage(item.name);
  }

  function imageList() {
    return state.items.filter(function (i) { return !i.is_dir && i.kind === "image"; });
  }
  function openImage(name) {
    var imgs = imageList();
    var idx = imgs.findIndex(function (i) { return i.name === name; });
    if (idx < 0) return;
    showImageAt(imgs, idx);
  }
  function showImageAt(imgs, idx) {
    $("imageModal").classList.add("open");
    $("imageView").src = fileUrl(itemRoot(imgs[idx]), imgs[idx].rel);
    $("imagePrev").onclick = function () { showImageAt(imgs, (idx - 1 + imgs.length) % imgs.length); };
    $("imageNext").onclick = function () { showImageAt(imgs, (idx + 1) % imgs.length); };
  }

  var UNSUPPORTED = [".mkv", ".avi", ".flv", ".wmv", ".ts"];
  function openVideo(item) {
    var v = $("videoView");
    v.src = fileUrl(itemRoot(item), item.rel);
    var ext = item.name.toLowerCase().match(/\.[a-z0-9]+$/);
    var ok = ext ? UNSUPPORTED.indexOf(ext[0]) < 0 : true;
    $("videoNote").hidden = ok;
    $("videoNote").textContent = ok ? "" : ("浏览器可能无法直接播放 " + (ext[0] || "").toUpperCase() + "，建议转码为 MP4。");
    $("videoModal").classList.add("open");
    // 播放弹窗右上角收藏按钮，实时同步当前视频收藏状态
    var favBtn = $("videoFav");
    favBtn.textContent = item.favorite ? "★" : "☆";
    favBtn.title = item.favorite ? "取消收藏" : "收藏";
    favBtn.onclick = function (e) {
      e.stopPropagation();
      toggleFavorite(item);
      favBtn.textContent = item.favorite ? "★" : "☆";
      favBtn.title = item.favorite ? "取消收藏" : "收藏";
    };
    // 播完自动按列表顺序播放下一个，直到列表末尾停止
    v.onended = function () {
      var list = videoList();
      var idx = list.indexOf(item);
      var next = idx >= 0 ? list[idx + 1] : undefined;
      if (next && !state.randomMode) openVideo(next);
    };
  }

  [["imageClose", "imageModal"], ["videoClose", "videoModal"]].forEach(function (pair) {
    $(pair[0]).addEventListener("click", function () { $(pair[1]).classList.remove("open"); closeMedia($(pair[1])); });
  });

  function closeMedia(modal) {
    state.randomMode = false;
    if (document.title.indexOf("🎲") === 0) document.title = "媒体浏览";
    var v = modal.querySelector("video");
    if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
  }

  /* ── 工具栏 ─────────────────────────────── */
  $("kindSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-kind]");
    if (!btn) return;
    Array.prototype.forEach.call($("kindSeg").children, function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    state.kind = btn.dataset.kind;
    resetAndLoad();
  });

  var searchTimer = null;
  $("searchInput").addEventListener("input", function () {
    clearTimeout(searchTimer);
    var val = this.value.trim();
    searchTimer = setTimeout(function () {
      if (state.q !== val) { state.q = val; resetAndLoad(); }
    }, 350);
  });

  $("refreshBtn").addEventListener("click", function () { resetAndLoad(); });
  $("loadMoreBtn").addEventListener("click", function () { loadNext(false); });
  $("randomBtn").addEventListener("click", function () {
    if (state.randomMode) { state.randomMode = false; closeMedia($("videoModal")); stopRandom(); }
    else { stopSequential(); startRandom(); }
  });
  $("seqBtn").addEventListener("click", function () {
    if (state.sequentialMode) { state.sequentialMode = false; closeMedia($("videoModal")); stopSequential(); }
    else { stopRandom(); startSequential(); }
  });
  $("favToggleBtn").addEventListener("click", function () {
    state.favoriteView = !state.favoriteView;
    this.classList.toggle("active", state.favoriteView);
    this.textContent = state.favoriteView ? "★ 只看收藏（再次点击返回浏览）" : "☆ 只看收藏";
    resetAndLoad();
  });

  // 滚动到底自动加载更多
  window.addEventListener("scroll", function () {
    if (!state.hasMore) return;
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadNext(false);
  });

  /* ── 添加目录 ───────────────────────────── */
  $("addRootBtn").addEventListener("click", function () { $("addRow").classList.add("open"); $("newRootInput").focus(); });
  $("cancelAddBtn").addEventListener("click", function () { $("addRow").classList.remove("open"); });
  $("confirmAddBtn").addEventListener("click", function () {
    var path = $("newRootInput").value.trim();
    if (!path) return;
    fetch("/api/media/roots", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (b) { throw new Error(b.detail || "添加失败"); });
      return r.json();
    }).then(function () {
      $("addRow").classList.remove("open");
      $("newRootInput").value = "";
      // 重新拉取根目录，自动选中最新添加的根
      var prevRoot = state.root;
      return fetch("/api/media/roots").then(function (r) { return r.json(); });
    }).then(function (body) {
      var before = state.roots.map(function (r) { return r.path; });
      state.roots = body.roots || [];
      var fresh = state.roots.find(function (r) { return before.indexOf(r.path) < 0; });
      if (fresh && fresh.exists) state.root = fresh.path;
      renderRootTabs();
      resetAndLoad();
    }).catch(function (err) { alert("添加失败：" + err.message); });
  });
  $("newRootInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("confirmAddBtn").click(); });

  loadRoots();
})();
</script>
</body>
</html>
