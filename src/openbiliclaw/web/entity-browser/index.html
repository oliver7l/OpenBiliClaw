<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>实体库 · 古灵阁</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #ffffff; --ink: #18181b; --muted: #71717a;
      --faint: #a1a1aa; --line: #f2f2f3; --line-strong: #e4e4e7;
      --accent: #b5715c; --accent-soft: #f6f6f7; --chip: #f6f6f7;
      --radius: 10px; --content-max: 1180px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC",
        "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      border-bottom: 1px solid var(--line); padding: 10px 20px;
      background: rgba(255,255,255,.92); backdrop-filter: saturate(160%) blur(8px);
      position: sticky; top: 0; z-index: 20;
    }
    .topbar-inner { max-width: var(--content-max); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; }
    .crumb { color: var(--faint); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .crumb:hover { color: var(--accent); }
    .search { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .search input {
      padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px;
      font-size: 13px; width: 220px; outline: none; background: var(--chip);
    }
    .search input:focus { border-color: var(--accent); background: #fff; }

    .wrap { max-width: var(--content-max); margin: 0 auto; padding: 24px 20px 60px; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .hidden { display: none !important; }

    /* 列表 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .card {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
      cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; background: #fff;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .card-desc { color: var(--muted); font-size: 12px; min-height: 36px; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .card-meta { display: flex; gap: 10px; font-size: 11px; color: var(--faint); }
    .type-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px;
      color: #fff; margin-bottom: 8px; }
    .load-state { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }
    .pager { display: flex; justify-content: center; gap: 8px; margin-top: 22px; align-items: center; }
    .btn {
      padding: 6px 16px; border: 1px solid var(--line-strong); border-radius: 999px;
      background: #fff; cursor: pointer; font-size: 13px; color: var(--ink);
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: .4; cursor: default; }

    /* 详情 */
    .detail-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
    .detail-head h2 { font-size: 22px; font-weight: 650; margin: 0; }
    .detail-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .desc-box {
      background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; font-size: 13px; color: #3f3f46; margin-bottom: 22px;
    }
    .stat-row { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 22px; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 18px; font-weight: 650; }
    .stat span { font-size: 11px; color: var(--faint); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 26px; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .panel h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
    .bar-label { width: 90px; text-align: right; color: var(--muted); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
    .bar-track { flex: 1; height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
    .bar-val { width: 44px; color: var(--faint); font-size: 11px; flex-shrink: 0; }
    .timeline-row { display: flex; align-items: flex-end; gap: 8px; height: 70px; padding-top: 6px; }
    .tl-bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .tl-bar i { display: block; width: 60%; background: var(--accent); border-radius: 3px 3px 0 0; opacity: .85; }
    .tl-bar i:hover { opacity: 1; }
    .tl-bar span { font-size: 10px; color: var(--faint); margin-top: 4px; white-space: nowrap; }

    .art-list { list-style: none; margin: 0; padding: 0; }
    .art-list li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0;
      border-bottom: 1px solid var(--line); font-size: 13px; }
    .art-list li:last-child { border-bottom: none; }
    .art-list .rank { color: var(--faint); font-size: 11px; width: 20px; flex-shrink: 0; }
    .art-list .src { color: var(--faint); font-size: 11px; margin-left: auto; flex-shrink: 0; }
    .chip-link { font-size: 12px; color: var(--accent); cursor: pointer; margin-right: 8px; }
    .chip-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="crumb" id="crumb-back">← 全部实体</span>
      <h1 id="page-title">实体库</h1>
      <div class="search">
        <input id="search-input" type="text" placeholder="搜索名称…">
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="list-view">
      <div id="list-state" class="load-state">加载中…</div>
      <div class="grid" id="list-grid"></div>
      <div class="pager" id="pager">
        <button class="btn" id="prev-btn">上一页</button>
        <span class="faint" id="page-info"></span>
        <button class="btn" id="next-btn">下一页</button>
      </div>
    </div>

    <div id="detail-view" class="hidden">
      <div id="detail-loading" class="load-state">加载中…</div>
      <div id="detail-body" class="hidden">
        <div class="detail-head">
          <h2 id="d-name"></h2>
          <span class="type-tag" id="d-type-tag"></span>
        </div>
        <div class="detail-sub">
          <span id="d-platform"></span><span id="d-seen"></span><span id="d-updated"></span>
        </div>
        <div class="desc-box" id="d-desc"></div>
        <div class="stat-row">
          <div class="stat"><b id="d-count"></b><span>篇文章</span></div>
          <div class="stat"><b id="d-first"></b><span>最早收录</span></div>
          <div class="stat"><b id="d-latest"></b><span>最新收录</span></div>
          <div class="stat"><b id="d-related-count"></b><span>相关实体</span></div>
        </div>
        <div class="cols">
          <div class="panel" id="topic-panel">
            <h3>主题分布</h3>
            <div id="topic-dist" class="faint">暂无数据</div>
          </div>
          <div class="panel">
            <h3>引用时间线（近 8 个月）</h3>
            <div class="timeline-row" id="d-timeline"></div>
          </div>
        </div>
        <div class="panel" style="margin-bottom: 26px;">
          <h3>相关实体</h3>
          <div id="d-related" class="faint">暂无共现实体</div>
        </div>
        <div class="panel">
          <h3>文章列表</h3>
          <ul class="art-list" id="d-articles"></ul>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var TYPE_LABEL = { author: '作者', topic: '主题', concept: '概念', organization: '机构', person: '人物', platform: '平台' };
  var TYPE_COLOR = { author: '#b5715c', topic: '#5c8ab5', concept: '#6ba36b', organization: '#9b7bb5', person: '#c08a4d', platform: '#4d9b9b' };
  var ACTIVE_TYPE = window.__ENTITY_TYPE__ || '';
  var page = 1, pageSize = 24, selectedId = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(s) { return s ? String(s).slice(0, 10) : '—'; }

  function init() {
    el('page-title').textContent = (TYPE_LABEL[ACTIVE_TYPE] || '实体') + '库';
    var qs = new URLSearchParams(location.search);
    if (qs.get('id')) openDetail(parseInt(qs.get('id'), 10));
    else loadList();
    el('crumb-back').addEventListener('click', function () {
      selectedId = null; el('detail-view').classList.add('hidden');
      el('list-view').classList.remove('hidden'); history.replaceState(null, '', location.pathname);
      loadList();
    });
    var timer = null;

    document.querySelectorAll('.tl-mode').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.tl-mode').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        tlMonths = parseInt(b.dataset.months, 10);
        if (selectedId != null) openDetail(selectedId);
      });
    });
    el('search-input').addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { page = 1; loadList(); }, 300);
    });
    el('prev-btn').addEventListener('click', function () { if (page > 1) { page--; loadList(); } });
    el('next-btn').addEventListener('click', function () { page++; loadList(); });
  }

  function loadList() {
    var q = el('search-input').value.trim();
    var url = '/api/entities?page=' + page + '&size=' + pageSize
      + (ACTIVE_TYPE ? '&type=' + encodeURIComponent(ACTIVE_TYPE) : '')
      + (q ? '&search=' + encodeURIComponent(q) : '');
    el('list-state').textContent = '加载中…';
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      el('list-state').classList.add('hidden');
      var grid = el('list-grid');
      grid.innerHTML = '';
      var items = data.items || [];
      if (!items.length) { el('list-state').classList.remove('hidden'); el('list-state').textContent = '没有找到实体'; return; }
      items.forEach(function (e) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<span class="type-tag" style="background:' + (TYPE_COLOR[e.type] || '#888') + '">' + esc(TYPE_LABEL[e.type] || e.type) + '</span>' +
          '<div class="card-name">' + esc(e.name) + '</div>' +
          '<div class="card-desc">' + esc(e.description || '暂无简介') + '</div>' +
          '<div class="card-meta"><span>' + (e.article_count || 0) + ' 篇</span>' +
          '<span>首现 ' + fmtDate(e.first_seen_at) + '</span></div>';
        card.addEventListener('click', function () { openDetail(e.id); });
        grid.appendChild(card);
      });
      var total = data.total || 0;
      var totalPages = Math.max(1, Math.ceil(total / pageSize));
      el('page-info').textContent = page + ' / ' + totalPages + '（共 ' + total + '）';
      el('prev-btn').disabled = page <= 1;
      el('next-btn').disabled = page >= totalPages;
    }).catch(function () {
      el('list-state').classList.remove('hidden');
      el('list-state').textContent = '加载失败';
    });
  }

  function openDetail(id) {
    selectedId = id;
    el('list-view').classList.add('hidden');
    el('detail-view').classList.remove('hidden');
    el('detail-body').classList.add('hidden');
    el('detail-loading').classList.remove('hidden');
    history.replaceState(null, '', location.pathname + '?id=' + id);
    fetch('/api/entities/' + id).then(function (r) { return r.json(); }).then(function (data) {
      var e = data.entity;
      el('detail-loading').classList.add('hidden');
      el('detail-body').classList.remove('hidden');
      el('d-name').textContent = e.name;
      var tag = el('d-type-tag');
      tag.textContent = TYPE_LABEL[e.type] || e.type;
      tag.style.background = TYPE_COLOR[e.type] || '#888';
      el('d-platform').textContent = e.type === 'author' && e.metadata ? (e.metadata.platform ? e.metadata.platform + ' · ' : '') : '';
      el('d-seen').textContent = '首现 ' + fmtDate(e.first_seen_at) + '  ·  ';
      el('d-updated').textContent = '更新 ' + fmtDate(e.last_updated_at);
      el('d-desc').textContent = e.description || '暂无简介（可运行 knowledge-forge entity-describe 自动生成）';
      el('d-count').textContent = e.article_count || 0;
      el('d-first').textContent = fmtDate(e.first_seen_at);
      el('d-latest').textContent = fmtDate(e.last_updated_at);
      var rel = e.related || [];
      el('d-related-count').textContent = rel.length;

      // 主题分布：相关实体中 type=topic 的共现占比
      var topics = rel.filter(function (r) { return r.type === 'topic'; }).sort(function (a, b) { return b.co_occur - a.co_occur; });
      var dist = el('topic-dist');
      if (!topics.length) { dist.className = 'faint'; dist.textContent = '暂无主题关联'; }
      else {
        dist.className = '';
        dist.innerHTML = '';
        var totalOcc = topics.reduce(function (s, t) { return s + t.co_occur; }, 0);
        topics.slice(0, 6).forEach(function (t) {
          var pct = Math.round(t.co_occur * 100 / totalOcc);
          var row = document.createElement('div');
          row.className = 'bar-row';
          row.innerHTML =
            '<span class="bar-label">' + esc(t.name) + '</span>' +
            '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
            '<span class="bar-val">' + pct + '%</span>';
          dist.appendChild(row);
        });
      }

      // 时间线
      var tl = el('d-timeline');
      tl.innerHTML = '';
      var timeline = e.timeline || [];
      if (!timeline.length) tl.innerHTML = '<span class="faint">暂无时间数据</span>';
      else {
        var maxN = Math.max.apply(null, timeline.map(function (t) { return t.count; }));
        timeline.forEach(function (t) {
          var bar = document.createElement('div');
          bar.className = 'tl-bar';
          var h = Math.max(4, Math.round(t.count * 60 / maxN));
          bar.innerHTML = '<i style="height:' + h + 'px" title="' + t.month + ' ' + t.count + ' 篇"></i><span>' + t.month + '</span>';
          tl.appendChild(bar);
        });
      }

      // 相关实体
      var rd = el('d-related');
      rd.className = '';
      rd.innerHTML = rel.length ? rel.map(function (r) {
        return '<span class="chip-link" data-id="' + r.id + '">' + esc(r.name) + '（' + r.co_occur + '）</span>';
      }).join('') : '<span class="faint">暂无共现实体</span>';
      rd.querySelectorAll('.chip-link').forEach(function (c) {
        c.addEventListener('click', function () { openDetail(parseInt(c.dataset.id, 10)); });
      });

      loadArticles(id);
    }).catch(function () {
      el('detail-loading').classList.remove('hidden');
      el('detail-loading').textContent = '实体不存在';
    });
  }

  function loadArticles(id) {
    fetch('/api/entities/' + id + '/articles?size=10').then(function (r) { return r.json(); }).then(function (data) {
      var items = data.items || [];
      var ul = el('d-articles');
      ul.innerHTML = items.length ? items.map(function (a, i) {
        var title = a.url ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title || '(无标题)') + '</a>' : esc(a.title || '(无标题)');
        return '<li><span class="rank">' + (i + 1) + '</span>' + title +
          '<span class="src">' + esc(a.source_type || '') + ' · ' + fmtDate(a.published_at) + '</span></li>';
      }).join('') : '<li class="faint">暂无关联文章</li>';
    }).catch(function () { el('d-articles').innerHTML = '<li class="faint">加载失败</li>'; });
  }

  init();
})();
</script>
</body>
</html>
