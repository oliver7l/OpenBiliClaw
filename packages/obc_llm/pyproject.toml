[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obc-llm"
version = "0.1.0"
description = "OpenBiliClaw LLM Provider System — multi-model LLM abstraction layer"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "httpx",
]

[project.optional-dependencies]
gemini = ["google-genai"]

[project.urls]
Homepage = "https://github.com/yourusername/openbiliclaw"